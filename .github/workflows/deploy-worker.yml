name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "cesi-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cesi-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./cesi-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 未配置仓库 Secret 时跳过部署并给出警告，避免每次 push 都因缺凭据而失败。
          # 在仓库 Settings → Secrets and variables → Actions 添加
          # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 后，此步自动生效、恢复 push 即部署。
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN，已跳过 Worker 部署（请到仓库 Secrets 添加后自动启用）。"
            exit 0
          fi
          npx wrangler deploy

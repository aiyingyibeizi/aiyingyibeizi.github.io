name: Typecheck Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "cesi-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cesi-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./cesi-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Deploy is handled by Cloudflare Workers Builds
        run: |
          # 部署已迁移到 Cloudflare Workers Builds（Workers → cesi-worker → 设置 → 构建）：
          # 该服务已连接本仓库 main 分支，根目录 cesi-worker，push 后由 Cloudflare 自动构建并部署。
          # 前置步骤的类型检查仍在此处执行，作为提交前的快速门禁。
          # 因此这里不再调用 wrangler deploy，避免与 Workers Builds 双重部署。
          echo "Type check passed. Deployment is handled by Cloudflare Workers Builds."

name = "cesi-worker"
main = "src/index.ts"
compatibility_date = "2024-07-17"
node_compat = true

# Non-sensitive values can live in [vars].
# For local development, put all secrets in .dev.vars (already created and gitignored).
# For production, run: npx wrangler secret bulk
[vars]
NEON_DSN = "__NEON_DSN__"
SUPABASE_DSN = "__SUPABASE_DSN__"
TURSO_URL_APEXON = "__TURSO_URL_APEXON__"
TURSO_TOKEN_APEXON = "__TURSO_TOKEN_APEXON__"
TURSO_URL_APEXON_1 = "__TURSO_URL_APEXON_1__"
TURSO_TOKEN_APEXON_1 = "__TURSO_TOKEN_APEXON_1__"
TURSO_URL_APEXON_2 = "__TURSO_URL_APEXON_2__"
TURSO_TOKEN_APEXON_2 = "__TURSO_TOKEN_APEXON_2__"
SUPABASE_URL = "__SUPABASE_URL__"
UPSTASH_REDIS_URL = "__UPSTASH_REDIS_URL__"

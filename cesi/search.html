<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="APEXON 站内搜索：搜索能力测试、站内页面与音乐。">
    <meta name="robots" content="noindex">
    <title data-i18n="searchTitle">搜索 - APEXON</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles/variables.css?v=8">
    <link rel="stylesheet" href="styles/main.css?v=21">
</head>
<body>
    <canvas id="particles"></canvas>
    <header class="apexon-header">
        <div class="apexon-header__inner">
            <div class="apexon-header-left">
                <a href="index.html" class="apexon-header-logo nav-main" draggable="false" ondragstart="return false" onselectstart="return false">
                    <img src="assets/favicon.png" alt="Logo" draggable="false">
                    <span>APEXON</span>
                </a>
                <label class="apex-bw-toggle" id="bwToggle" data-i18n-title="themeToggle" title="切换深色/明亮主题">
                    <input type="checkbox" id="bwToggleInput" data-i18n-aria-label="themeToggle" aria-label="切换主题">
                    <span class="apex-bw-toggle__track">
                        <span class="apex-bw-toggle__thumb">
                            <span class="apex-bw-toggle__icon" id="bwToggleIcon">🌈</span>
                        </span>
                    </span>
                </label>
            </div>
            <div class="apexon-header-center">
                <button class="apexon-menu-btn" onclick="toggleMenu()" data-i18n-title="menuOpen" aria-label="打开菜单">☰</button>
                <nav class="apexon-header-nav" id="headerPill">
                    <a href="index.html" class="nav-main" data-i18n="navHome">首页</a>
                </nav>
                <a href="music.html" class="apex-music-btn" data-i18n="navMusic">Music</a>

                <nav class="apexon-header-dropdown" id="headerDropdown">
                    <a href="index.html" class="nav-main" data-i18n="navHome">首页</a>
                    <a href="reaction.html" data-i18n="navReaction">反应测试</a>
                    <a href="type.html" data-i18n="navType">打字测试</a>
                    <a href="stick.html" data-i18n="navStick">注意力测试</a>
                    <a href="number.html" data-i18n="navNumber">数字记忆</a>
                    <a href="verbal.html" data-i18n="navVerbal">单词记忆</a>
                    <a href="visual.html" data-i18n="navVisual">视觉记忆</a>
                    <a href="sequence.html" data-i18n="navSequence">序列记忆</a>
                    <a href="aim.html" data-i18n="navAim">瞄准训练</a>
                    <a href="stroop.html" data-i18n="navStroop">Stroop 测试</a>
                    <a href="nback.html" data-i18n="navNback">N-Back 测试</a>
                    <a href="taskswitch.html" data-i18n="navTaskswitch">Task Switching</a>
                    <a href="visualsearch.html" data-i18n="navVisualsearch">Visual Search</a>
                    <a href="music.html" data-i18n="navMusic">Music</a>
                </nav>
            </div>
            <div class="header-actions" style="position: relative;">
                <div class="apex-style-picker" style="margin-right: 8px;"></div>
                <button class="apex-palette-btn" title="切换主题配色">🎨</button>
                <div class="apex-palette-panel" hidden>
                    <h6>主题配色</h6>
                    <div class="apex-palette-row">
                        <div class="apex-palette-swatch" data-accent="cyan" style="background:#8b7efc;"></div>
                        <div class="apex-palette-swatch" data-accent="emerald" style="background:#34d399;"></div>
                        <div class="apex-palette-swatch" data-accent="amber" style="background:#fbbf24;"></div>
                        <div class="apex-palette-swatch" data-accent="rose" style="background:#f472b6;"></div>
                        <div class="apex-palette-swatch" data-accent="indigo" style="background:#818cf8;"></div>
                        <div class="apex-palette-swatch" data-accent="coral" style="background:#fb923c;"></div>
                        <div class="apex-palette-swatch" data-accent="sunset" style="background:#f97316;"></div>
                        <div class="apex-palette-swatch" data-accent="mint" style="background:#2dd4bf;"></div>
                        <div class="apex-palette-swatch" data-accent="crimson" style="background:#f43f5e;"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="hero" style="padding-top:28px;padding-bottom:8px;">
            <div class="hero-tagline" data-i18n="searchHeroTagline">搜索能力测试、站内页面与音乐</div>
            <form class="search-box" id="siteSearchForm" role="search" onsubmit="event.preventDefault(); var q=document.getElementById('siteSearchInput').value.trim(); if(q) location.href='search.html?q='+encodeURIComponent(q);">
                <input id="siteSearchInput" name="q" data-i18n-placeholder="searchPlaceholder" placeholder="搜索测试、页面与音乐" required autocomplete="off">
                <button type="submit" data-i18n="searchButton">搜索</button>
                <div class="search-suggest-panel" id="siteSearchPanel" aria-live="polite"></div>
            </form>
        </div>

        <div id="searchResults" class="search-results-wrap"></div>
    </div>

    <script src="js/i18n.js?v=13"></script>
    <script src="js/common.js?v=34"></script>
    <script src="js/achievements.js?v=2"></script>
    <script src="js/search.js?v=1"></script>
    <script>
    (function () {
        // 粒子背景
        if (window.APEXON && APEXON.Particles) APEXON.Particles.init();

        // 站内搜索：即时建议
        if (window.APEXON && APEXON.Search) {
            APEXON.Search.attachLive(
                document.getElementById('siteSearchInput'),
                document.getElementById('siteSearchPanel')
            );
        }

        // 从 URL 读取 q 参数并渲染结果
        const params = new URLSearchParams(location.search);
        const q = (params.get('q') || '').trim();
        const input = document.getElementById('siteSearchInput');
        if (q && input) input.value = q;
        if (window.APEXON && APEXON.Search) {
            APEXON.Search.renderResults(q, 'searchResults');
        }

        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

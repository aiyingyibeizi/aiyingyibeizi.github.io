<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>持续注意力测试 - APEXON</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        canvas#testBox {
            width: 100%;
            height: 360px;
            border-radius: var(--apex-radius);
            display: block;
            background: linear-gradient(135deg, #7c6bc4, #9b8fd4);
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(124, 107, 196, 0.3);
            touch-action: none;
        }
        .countdown-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .countdown-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--apex-accent-purple);
            font-variant-numeric: tabular-nums;
        }
        .score-live {
            font-size: 18px;
            font-weight: 600;
            color: var(--apex-text);
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <header class="apexon-header">
        <div class="apexon-header__inner">
            <a href="index.html" class="apexon-header-logo">
                <img src="assets/favicon.png" alt="Logo">
                <span>APEXON</span>
            </a>
            <button class="apexon-menu-btn" onclick="toggleMenu()" aria-label="打开菜单">☰</button>
            <nav class="apexon-header-nav" id="headerNav">
                <a href="index.html">首页</a>
                <a href="reaction.html">反应测试</a>
                <a href="type.html">打字测试</a>
                <a href="stick.html" class="active">注意力测试</a>
                <a href="number.html">数字记忆</a>
                <a href="verbal.html">单词记忆</a>
                <a href="visual.html">视觉记忆</a>
                <a href="aim.html">瞄准训练</a>
                <a href="sequence.html">序列记忆</a>
            </nav>
            <div class="header-actions">
                <label class="apex-bw-toggle" id="bwToggle" title="切换深色/明亮主题">
                    <input type="checkbox" id="bwToggleInput" aria-label="切换黑白模式">
                    <span class="apex-bw-toggle__track">
                        <span class="apex-bw-toggle__thumb">
                            <span class="apex-bw-toggle__icon" id="bwToggleIcon">🌈</span>
                        </span>
                    </span>
                </label>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>持续注意力测试</h1>

        <div class="countdown-wrap">
            <div class="countdown-number" id="countdownNum">60</div>
            <div class="score-live">得分: <span id="scoreLive">0</span></div>
        </div>

        <canvas id="testBox"></canvas>

        <div class="result" id="result"></div>

        <div class="btn-group">
            <button class="btn" onclick="restartTest()">再来一次</button>
            <button class="btn" onclick="backHome()">返回主界面</button>
        </div>

        <div class="history-list" style="margin-top:24px">
            <div class="history-title">最近记录</div>
            <div id="historyContent">还没有记录</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
    (function () {
        window.toggleMenu = function () {
            document.getElementById('headerNav').classList.toggle('open');
        };
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.apexon-header')) document.getElementById('headerNav').classList.remove('open');
        });

        // 粒子背景
        APEXON.Particles.init();

        // ===== 测试逻辑 =====
        const BALL_RADIUS = 35, MIN_SPEED = 2, MAX_SPEED_BASE = 5, CHANGE_RATE = 0.03;
        const INITIAL_HP = 100, CLICK_DAMAGE = 1.2, HOVER_BONUS = 5;
        const HOVER_INTERVAL_MS = 100, HOVER_DISTANCE_OFFSET = 10;
        const GAME_DURATION = 60, TICK_INTERVAL_MS = 1000;

        const canvas = document.getElementById('testBox');
        const result = document.getElementById('result');
        const countdownNum = document.getElementById('countdownNum');
        const scoreLive = document.getElementById('scoreLive');
        const historyContent = document.getElementById('historyContent');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        const ctx = canvas.getContext('2d');

        let score = 0, timeLeft = GAME_DURATION, running = false;
        let timer = null, animationId = null, hoverTime = 0;
        let lastFrameTime = performance.now(), mouseX = 0, mouseY = 0;
        let started = false, ball = null, particles = [], isPaused = false;

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.life = 1.0; this.color = color;
                this.size = Math.random() * 4 + 2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vy += 0.2; this.life -= 0.02; this.size *= 0.97;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 12; i++) particles.push(new Particle(x, y, color));
        }

        function isMouseHovering() {
            return Math.hypot(ball.x - mouseX, ball.y - mouseY) < ball.r + HOVER_DISTANCE_OFFSET;
        }

        function randomSpeed() {
            const boost = 1 + (GAME_DURATION - timeLeft) / GAME_DURATION * 0.5;
            return (Math.random() * (MAX_SPEED_BASE * boost - MIN_SPEED) + MIN_SPEED) * (Math.random() > 0.5 ? 1 : -1);
        }

        class Ball {
            constructor() { this.reset(); }
            reset() {
                this.r = BALL_RADIUS;
                this.x = Math.random() * (canvas.width - this.r * 2) + this.r;
                this.y = Math.random() * (canvas.height - this.r * 2) + this.r;
                this.vx = randomSpeed(); this.vy = randomSpeed();
                this.hp = INITIAL_HP;
            }
            update() {
                if (!running) return;
                if (Math.random() < CHANGE_RATE) { this.vx = randomSpeed(); this.vy = randomSpeed(); }
                this.x += this.vx; this.y += this.vy;
                if (this.x < this.r || this.x > canvas.width - this.r) this.vx *= -1;
                if (this.y < this.r || this.y > canvas.height - this.r) this.vy *= -1;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = '#4caf50'; ctx.fill();
                ctx.beginPath(); ctx.arc(this.x - 8, this.y - 8, this.r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(this.x - 40, this.y - this.r - 16, 80, 8);
                ctx.fillStyle = this.hp > 50 ? '#4caf50' : this.hp > 25 ? '#ff9800' : '#f44336';
                ctx.fillRect(this.x - 40, this.y - this.r - 16, 80 * (this.hp / INITIAL_HP), 8);
            }
        }

        async function renderHistory() {
            const esc = APEXON.Security.escapeHtml;
            try {
                const history = await APEXON.DB.getHistoryByUserAndType(APEXON.Auth.getUserId(), 'stick', 5);
                if (!history.length) {
                    historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">还没有记录</div>';
                    return;
                }
                historyContent.innerHTML = history.map(h => '<div class="history-item"><span class="history-date">' + esc(h.date || new Date(h.timestamp).toLocaleDateString('zh-CN')) + '</span><span class="history-score">' + esc(h.score) + ' 分</span></div>').join('');
            } catch(e) {
                 historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">加载记录失败</div>';
            }
        }

        function handleStart() { if (!started) { started = true; startGame(); } }

        let lastTouchTime = 0;
        function handleTouchStart(e) {
            const now = performance.now();
            if (now - lastTouchTime < 100) return;
            lastTouchTime = now;
            e.preventDefault();
            if (!started) { handleStart(); return; }
            const r = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - r.left; mouseY = touch.clientY - r.top;
            if (isMouseHovering()) ball.hp -= CLICK_DAMAGE;
        }

        canvas.addEventListener('click', handleStart);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('mousemove', (e) => {
            if (!running || !ball) return;
            const r = canvas.getBoundingClientRect();
            mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
            if (isMouseHovering()) ball.hp -= CLICK_DAMAGE;
        });

        function drawScene() {
            if (isPaused) { animationId = requestAnimationFrame(drawScene); return; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            if (!started) {
                ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('点击开始测试', canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = '16px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText('鼠标悬停在球上即可得分', canvas.width / 2, canvas.height / 2 + 24);
            }

            if (running) {
                const currentTime = performance.now();
                const deltaTime = currentTime - lastFrameTime;
                lastFrameTime = currentTime;
                ball.update(); ball.draw();
                if (ball.hp <= 0) {
                    spawnParticles(ball.x, ball.y, '#4caf50');
                    ball.reset(); score += 1; scoreLive.textContent = score;
                    if (APEXON.Audio) APEXON.Audio.playSuccess();
                }
                const hovering = isMouseHovering();
                if (hovering) {
                    hoverTime += deltaTime;
                    while (hoverTime >= HOVER_INTERVAL_MS) { score += HOVER_BONUS; hoverTime -= HOVER_INTERVAL_MS; scoreLive.textContent = score; }
                } else { hoverTime = 0; }
                particles = particles.filter(p => p.life > 0);
                particles.forEach(p => { p.update(); p.draw(ctx); });
            }
            animationId = requestAnimationFrame(drawScene);
        }

        function startGame() {
            score = 0; timeLeft = GAME_DURATION; running = true;
            ball = new Ball(); hoverTime = 0; particles = [];
            lastFrameTime = performance.now();
            countdownNum.textContent = timeLeft; scoreLive.textContent = score;
            result.innerHTML = '';
            timer = setInterval(() => {
                timeLeft--; countdownNum.textContent = timeLeft;
                if (timeLeft <= 10) { countdownNum.style.color = '#f44336'; if (APEXON.Audio) APEXON.Audio.playTick(); }
                if (timeLeft <= 0) endGame();
            }, TICK_INTERVAL_MS);
            if (APEXON.Audio) APEXON.Audio.playSuccess();
        }

        async function endGame() {
            running = false; clearInterval(timer); cancelAnimationFrame(animationId);
            countdownNum.style.color = '';
            const grades = [
                { min: 200, grade: 'S', color: '#FFD700' },
                { min: 150, grade: 'A', color: '#FF6B6B' },
                { min: 100, grade: 'B', color: '#4ECDC4' },
                { min: 50, grade: 'C', color: '#95E1D3' },
                { min: 0, grade: 'D', color: '#aaa' }
            ];
            const grade = grades.find(g => score >= g.min) || grades[grades.length - 1];
            result.innerHTML = '<div class="score-card"><div class="score-grade" style="color:' + grade.color + '">' + grade.grade + '</div><div class="score-label">最终得分 ' + score + ' 分</div><div class="score-details"><div class="score-detail-item"><div class="score-detail-value">' + score + '</div><div class="score-detail-label">总得分</div></div><div class="score-detail-item"><div class="score-detail-value">' + GAME_DURATION + 's</div><div class="score-detail-label">时长</div></div><div class="score-detail-item"><div class="score-detail-value">' + grade.grade + '</div><div class="score-detail-label">等级</div></div></div></div>';

            const saved = await APEXON.DB.saveScore(APEXON.Auth.getUserId(), APEXON.Auth.getUser(), 'stick', { score: score });
            if (!saved) APEXON.UI.toast('数据保存失败，请重试');

            if (APEXON.Audio) APEXON.Audio.playSuccess();
            if (navigator.vibrate) navigator.vibrate(50);
            renderHistory();
        }

        window.restartTest = function () {
            clearInterval(timer); cancelAnimationFrame(animationId);
            started = false; running = false; particles = [];
            countdownNum.textContent = GAME_DURATION; countdownNum.style.color = '';
            scoreLive.textContent = '0'; result.innerHTML = '';
            drawScene();
        };

        if (APEXON.Visibility && APEXON.Visibility.onChange) {
            APEXON.Visibility.onChange((visible) => {
                if (!visible) isPaused = true;
                else { isPaused = false; lastFrameTime = performance.now(); }
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!started) handleStart(); }
            if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey) restartTest();
        });

        if (APEXON.Utils && APEXON.Utils.debounce) {
            window.addEventListener('resize', APEXON.Utils.debounce(() => {
                canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            }, 250));
        } else {
            window.addEventListener('resize', () => {
                canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            });
        }

        // 初始化
        renderHistory();
        drawScene();
        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

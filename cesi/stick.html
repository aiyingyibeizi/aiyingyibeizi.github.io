<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>持续注意力测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 30px 20px;
            background: #f0f0f0;
            overflow-y: auto;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: 360px;
            border-radius: 14px;
            display: block;
            background: #b71c1c;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            text-align: center;
        }

        .btn-group {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 10px 26px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="testBox"></canvas>
        <div class="result" id="result"></div>
        <div class="btn-group">
            <button class="btn" onclick="restartTest()">再来一次</button>
            <button class="btn" onclick="backHome()">返回主界面</button>
        </div>
    </div>
    <script>
        let score = 0, timeLeft = 60, running = false, timer = null, animationId = null;
        let hoverTime = 0; // 累计停留时间（毫秒）
        let lastFrameTime = performance.now(); // 上一帧时间戳
        let mouseX = 0, mouseY = 0; // 鼠标坐标
        const canvas = document.getElementById("testBox"), result = document.getElementById("result");
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        const ctx = canvas.getContext("2d");
        let ball = null;
        class Ball {
            constructor() { this.reset(); }
            reset() {
                this.r = 35;
                this.x = Math.random() * (canvas.width - this.r * 2) + this.r;
                this.y = Math.random() * (canvas.height - this.r * 2) + this.r;
                this.vx = (Math.random() * 5 + 2) * (Math.random() > 0.5 ? 1 : -1);
                this.vy = (Math.random() * 5 + 2) * (Math.random() > 0.5 ? 1 : -1);
                this.hp = 100;
            }
            update() {
                if (!running) return;
                if (Math.random() < 0.03) { this.vx = (Math.random() * 5 + 2) * (Math.random() > 0.5 ? 1 : -1); this.vy = (Math.random() * 5 + 2) * (Math.random() > 0.5 ? 1 : -1); }
                this.x += this.vx; this.y += this.vy;
                if (this.x < this.r || this.x > canvas.width - this.r) this.vx *= -1;
                if (this.y < this.r || this.y > canvas.height - this.r) this.vy *= -1;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fillStyle = "#4caf50"; ctx.fill();
                ctx.fillStyle = "#333"; ctx.fillRect(this.x - 40, this.y - this.r - 12, 80, 8);
                ctx.fillStyle = "lime"; ctx.fillRect(this.x - 40, this.y - this.r - 12, 80 * (this.hp / 100), 8);
            }
        }
        let started = false;
        canvas.onclick = e => { if (!started) { started = true; startGame(); } };
        canvas.onmousemove = e => {
            if (!running) return;
            const r = canvas.getBoundingClientRect();
            mouseX = e.clientX - r.left;
            mouseY = e.clientY - r.top;
            if (Math.hypot(ball.x - mouseX, ball.y - mouseY) < ball.r + 10) ball.hp -= 1.2;
        };
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!started) { ctx.fillStyle = "#fff"; ctx.font = "28px sans-serif"; ctx.textAlign = "center"; ctx.fillText("点击开始测试", canvas.width / 2, canvas.height / 2); }
            if (running) {
                const currentTime = performance.now();
                const deltaTime = currentTime - lastFrameTime; // 计算帧间隔（毫秒）
                lastFrameTime = currentTime;

                ball.update(); ball.draw();
                if (ball.hp <= 0) {
                    ball.reset();
                    score += 1; // 消灭小球+1分（保留原逻辑）
                }

                // 停留得分逻辑：每0.1秒+5分
                const isHovering = Math.hypot(ball.x - mouseX, ball.y - mouseY) < ball.r + 10;
                if (isHovering) {
                    hoverTime += deltaTime;
                    while (hoverTime >= 100) { // 每累计100ms触发一次
                        score += 5;
                        hoverTime -= 100; // 扣除已计数的时间，避免重复加分
                    }
                } else {
                    hoverTime = 0; // 离开小球区域，重置停留时间
                }

                ctx.fillStyle = "#fff"; ctx.font = "18px sans-serif"; ctx.textAlign = "left";
                ctx.fillText("剩余时间：" + timeLeft + " 秒", 15, 28);
                ctx.fillText("得分：" + score, 15, 54);
            }
            animationId = requestAnimationFrame(drawScene);
        }
        function startGame() {
            score = 0; timeLeft = 60; running = true; ball = new Ball();
            hoverTime = 0; // 重置停留时间
            lastFrameTime = performance.now(); // 重置帧时间
            timer = setInterval(() => { timeLeft--; if (timeLeft <= 0) endGame(); }, 1000);
        }
        function endGame() {
            running = false; clearInterval(timer); cancelAnimationFrame(animationId);
            ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff"; ctx.textAlign = "center";
            ctx.font = "32px sans-serif"; ctx.fillText("最终得分", canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = "48px sans-serif"; ctx.fillText(score, canvas.width / 2, canvas.height / 2 + 40);
        }
        function restartTest() { clearInterval(timer); cancelAnimationFrame(animationId); started = false; startGame(); }
        function backHome() { window.location.href = "index.html"; }
        drawScene();
    </script>
</body>

</html>

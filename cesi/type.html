<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打字训练测试</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .type-hint-bar {
            background: white;
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 12px 20px;
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            text-align: center;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            margin-bottom: 0;
        }
        .type-hint-bar strong { color: var(--text); margin-right: 6px; }
        #testBox {
            width: 100%;
            background: linear-gradient(135deg, #49df9b 0%, #3dd8a0 100%);
            border-radius: 0 0 var(--radius) var(--radius);
            padding: 24px;
            color: #fff;
            font-size: clamp(16px, 5vw, 24px);
            line-height: 2.2;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: var(--shadow-md);
            word-break: break-all;
            letter-spacing: 2px;
            font-weight: 600;
            text-align: center;
        }
        #inputArea {
            width: 100%; height: 100px; margin-top: 15px;
            padding: 12px 16px; border-radius: var(--radius);
            border: 2px solid var(--border);
            font-size: clamp(16px, 4vw, 20px);
            resize: none; box-shadow: var(--shadow-sm);
            transition: var(--transition); font-family: inherit;
            line-height: 1.6; background: white;
        }
        #inputArea:focus { outline: none; border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(73, 223, 155, 0.15), var(--shadow-sm); }
        #inputArea:disabled { background: #f5f5f5; opacity: 0.7; cursor: not-allowed; }
        .wrong { color: #ffeb3b; font-weight: 700; text-decoration: underline; }
        .right { color: #fff; }
        .pending { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <img src="assets/favicon.png" alt="Logo" class="auth-logo">
            <button style="position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:transparent;border-radius:50%;cursor:pointer;font-size:20px;color:#94a3b8;" onclick="hideAuth()">✕</button>
            <h2>登录 APEXON</h2>
            <div class="auth-sub">登录后保存成绩</div>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')" id="tabLogin">登录</button>
                <button class="auth-tab" onclick="switchTab('register')" id="tabRegister">注册</button>
            </div>
            <div id="authFormLogin">
                <input type="text" class="auth-input" id="loginUser" placeholder="用户名" maxlength="20">
                <input type="password" class="auth-input" id="loginPass" placeholder="密码" maxlength="30">
                <label class="remember-row">
                    <input type="checkbox" id="loginRemember" checked>
                    <span>30天内自动登录</span>
                </label>
                <div class="auth-error" id="loginError"></div>
                <button class="auth-btn" onclick="handleLogin()">登录</button>
            </div>
            <div id="authFormRegister" style="display:none">
                <input type="text" class="auth-input" id="regUser" placeholder="用户名（2-20位）" maxlength="20">
                <input type="password" class="auth-input" id="regPass" placeholder="密码（至少8位，含字母+数字）" maxlength="30">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-text" id="strengthText"></div>
                <input type="password" class="auth-input" id="regPass2" placeholder="确认密码" maxlength="30">
                <div class="auth-error" id="regError"></div>
                <button class="auth-btn" onclick="handleRegister()">注册并登录</button>
            </div>
            <div class="auth-hint">未登录也能测试，但成绩不会保存</div>
        </div>
    </div>

    <header class="apexon-header">
        <a href="index.html" class="apexon-header-logo">
            <img src="assets/favicon.png" alt="Logo">
            <span>APEXON</span>
        </a>
        <button class="apexon-menu-btn" onclick="toggleMenu()">☰</button>
        <nav class="apexon-header-nav" id="headerNav">
            <a href="index.html">首页</a>
            <a href="reaction.html">反应测试</a>
            <a href="type.html" class="active">打字测试</a>
            <a href="stick.html">注意力测试</a>
        </nav>
        <div class="user-dropdown-wrap" id="userDropdownWrap" style="display:none">
            <button class="user-btn" onclick="toggleUserMenu()">
                <span class="user-avatar" id="userAvatar">A</span>
                <span id="userName">用户</span>
            </button>
            <div class="user-menu" id="userMenu">
                <div class="user-menu-item" style="cursor:default;color:#64748b;font-size:12px;">已登录：<strong id="menuUserName">用户</strong></div>
                <div class="user-menu-hr"></div>
                <button class="user-menu-item" onclick="APEXON.logout()">退出登录</button>
                <button class="user-menu-item danger" onclick="APEXON.deleteAccount()">注销账号</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>打字训练测试</h1>

        <div class="progress-wrap">
            <div class="progress-label">
                <span>进度</span>
                <span id="progressText">0 / 5</span>
            </div>
            <div class="progress-bar">
                <div class="fill" id="progressFill" style="width:0%"></div>
            </div>
        </div>

        <div class="live-stats" id="liveStats">
            <div class="live-stat-item">
                <div class="live-stat-value" id="liveWpm">0</div>
                <div class="live-stat-label">WPM</div>
            </div>
            <div class="live-stat-item">
                <div class="live-stat-value" id="liveCpm">0</div>
                <div class="live-stat-label">CPM</div>
            </div>
            <div class="live-stat-item">
                <div class="live-stat-value" id="liveAcc">0%</div>
                <div class="live-stat-label">正确率</div>
            </div>
            <div class="live-stat-item">
                <div class="live-stat-value" id="liveTime">0.0s</div>
                <div class="live-stat-label">用时</div>
            </div>
        </div>

        <div class="type-hint-bar" id="typeHint">准备开始</div>
        <div id="testBox"></div>
        <textarea id="inputArea" placeholder="在这里打字..."></textarea>

        <div class="result" id="result"></div>

        <div class="btn-group">
            <button class="btn" onclick="restartTest()">重新开始</button>
            <button class="btn" onclick="backHome()">返回主界面</button>
        </div>

        <div class="history-list" style="margin-top:24px">
            <div class="history-title">最近记录</div>
            <div id="historyContent">还没有记录</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
    (function () {
        const authOverlay = document.getElementById('authOverlay');
        const loginUser = document.getElementById('loginUser');
        const loginPass = document.getElementById('loginPass');
        const loginRemember = document.getElementById('loginRemember');
        const regUser = document.getElementById('regUser');
        const regPass = document.getElementById('regPass');
        const regPass2 = document.getElementById('regPass2');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const loginError = document.getElementById('loginError');
        const regError = document.getElementById('regError');

        function showAuth() { if(authOverlay) authOverlay.classList.add('show'); }
        function hideAuth() { if(authOverlay) authOverlay.classList.remove('show'); }
        window.hideAuth = hideAuth;
        window.switchTab = function(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('authFormLogin').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('authFormRegister').style.display = tab === 'register' ? 'block' : 'none';
            loginError.textContent = ''; regError.textContent = '';
        };
        regPass.addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (val.length >= 12) score++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            if (/\d/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;
            const colors = ['#e2e8f0', '#ef4444', '#f59e0b', '#22c55e', '#10b981', '#0ea5e9'];
            const texts = ['', '太弱', '一般', '还行', '不错', '很强'];
            const pct = Math.min(score / 5 * 100, 100);
            strengthFill.style.width = pct + '%';
            strengthFill.style.background = colors[score] || colors[0];
            strengthText.textContent = texts[score] || '';
        });
        window.handleLogin = function() {
            if (typeof APEXON === 'undefined') { alert('系统未加载，请刷新页面'); return; }
            const res = APEXON.Account.login(loginUser.value, loginPass.value, loginRemember.checked);
            if (!res.success) { loginError.textContent = res.message; return; }
            hideAuth(); initUser();
        };
        window.handleRegister = function() {
            if (typeof APEXON === 'undefined') { alert('系统未加载，请刷新页面'); return; }
            if (regPass.value !== regPass2.value) { regError.textContent = '两次密码不一致'; return; }
            const res = APEXON.Account.register(regUser.value, regPass.value);
            if (!res.success) { regError.textContent = res.message; return; }
            hideAuth(); initUser();
        };
        [loginUser, loginPass].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); }));
        [regUser, regPass, regPass2].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); }));
        window.toggleUserMenu = function() { document.getElementById('userMenu').classList.toggle('show'); };
        document.addEventListener('click', e => { if (!e.target.closest('.user-dropdown-wrap')) document.getElementById('userMenu').classList.remove('show'); });
        function initUser() {
            if (typeof APEXON === 'undefined') return;
            const user = APEXON.Account.getUser();
            if (!user) return;
            document.getElementById('userDropdownWrap').style.display = 'block';
            document.getElementById('userName').textContent = user;
            document.getElementById('userAvatar').textContent = user.charAt(0).toUpperCase();
            document.getElementById('menuUserName').textContent = user;
            renderHistory();
        }
        if (typeof APEXON !== 'undefined' && APEXON.Account && APEXON.Account.isLoggedIn()) { initUser(); }
        else { showAuth(); }

        const TOTAL_ROUNDS = 5, ROUND_DELAY_MS = 800, MS_PER_SECOND = 1000;
        const sentences = [
            "星光不问赶路人人心依旧奔赴远方从未停下脚步",
            "生活原本平淡无风奔跑起来自有清风和光亮",
            "心怀温柔奔赴前路认真生活不负时光不负自己",
            "保持初心踏实前行每一步都向着理想慢慢靠近",
            "看淡世事内心安然静静努力默默沉淀慢慢发光",
            "迎着风雨勇敢向前所有坎坷终会变成过往云烟",
            "守住本心稳住心态安静成长不慌不忙变优秀",
            "一路向前不问归途只管努力剩下的交给时光吧",
            "平凡日子认真过点滴努力终会汇聚成万丈光芒",
            "心怀热爱奔赴山海不惧前路漫长只管踏实前行",
            "放下焦虑稳住脚步慢慢沉淀终会遇见更好的自己",
            "岁月无言沉淀成长默默坚持总有一天会闪闪发光",
            "晨雾不阻行者步履始终向着理想不曾停歇",
            "岁月本就寻常坚持前行自会遇见温暖与希望",
            "怀揣赤诚踏遍征途用心度日不负韶华不负初心",
            "坚守信念稳步向前每段征程都向美好缓缓抵达",
            "看透纷扰心境平和默默耕耘静静积蓄悄然绽放",
            "直面困境无畏前行所有磨难终将化作成长勋章",
            "坚守自我放平心境悄然蜕变从容不迫成为更好",
            "坚定前行不问终点全心付出余下皆为岁月馈赠",
            "寻常岁月用心经营微小付出终将凝聚成耀眼光芒",
            "怀揣热忱踏遍山河不畏征途遥远只管坚定向前",
            "抛开浮躁放缓步伐默默积蓄终将邂逅更优秀的你",
            "时光不语滋养成长恒久坚守终有一日绽放璀璨"
        ];

        const box = document.getElementById('testBox');
        const input = document.getElementById('inputArea');
        const resDom = document.getElementById('result');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const liveWpm = document.getElementById('liveWpm');
        const liveCpm = document.getElementById('liveCpm');
        const liveAcc = document.getElementById('liveAcc');
        const liveTime = document.getElementById('liveTime');
        const historyContent = document.getElementById('historyContent');

        let nowText = '', startTime = 0, isStart = false;
        let currentRound = 0, timeList = [], accList = [], cpmList = [], wpmList = [], timer = null;

        window.toggleMenu = function () {
            document.getElementById('headerNav').classList.toggle('open');
        };
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.apexon-header')) document.getElementById('headerNav').classList.remove('open');
        });

        function getRandomText() { return sentences[Math.floor(Math.random() * sentences.length)]; }
        function isChineseChar(str) { return /^[\u4E00-\u9FA5]$/.test(str); }
        function getValidChineseCount(str) {
            let count = 0;
            for (const c of str) { if (isChineseChar(c)) count++; }
            return count;
        }
        function calcAvg(arr) {
            const sum = arr.reduce((acc, item) => acc + parseFloat(item), 0);
            return (sum / arr.length).toFixed(1);
        }
        function updateProgress() {
            progressFill.style.width = (currentRound / TOTAL_ROUNDS * 100) + '%';
            progressText.textContent = currentRound + ' / ' + TOTAL_ROUNDS;
        }
        function updateLiveStats(inputVal, right) {
            if (!isStart) return;
            const elapsed = (performance.now() - startTime) / MS_PER_SECOND;
            const chineseCount = getValidChineseCount(inputVal);
            const cpm = elapsed > 0 ? (chineseCount / elapsed * 60).toFixed(0) : 0;
            const wpm = elapsed > 0 ? (chineseCount / elapsed * 60 / 5).toFixed(0) : 0;
            const accuracy = inputVal.length > 0 ? ((right / inputVal.length) * 100).toFixed(0) : 0;
            liveWpm.textContent = wpm; liveCpm.textContent = cpm;
            liveAcc.textContent = accuracy + '%'; liveTime.textContent = elapsed.toFixed(1) + 's';
        }

        function renderHistory() {
            if (typeof APEXON === 'undefined') {
                historyContent.innerHTML = '<div style="color:#999;font-size:13px">登录后保存记录</div>';
                return;
            }
            const esc = APEXON.Security.escapeHtml;
            const history = APEXON.Storage.getHistory('type', 5);
            if (!history.length) {
                historyContent.innerHTML = '<div style="color:#999;font-size:13px">还没有记录</div>';
                return;
            }
            historyContent.innerHTML = history.map(h =>
                '<div class="history-item">' +
                    '<span class="history-date">' + esc(h.date || new Date(h.timestamp).toLocaleDateString('zh-CN')) + '</span>' +
                    '<span class="history-score">' + esc(h.avg) + ' s / ' + esc(h.accuracy) + '%</span>' +
                '</div>'
            ).join('');
        }

        function initText() {
            isStart = false; input.value = ''; nowText = getRandomText();
            if (currentRound === 0) { timeList = []; accList = []; cpmList = []; wpmList = []; }
            document.getElementById('typeHint').innerHTML = '<strong>第' + (currentRound + 1) + '/' + TOTAL_ROUNDS + '轮</strong>输入这段文字';
            box.innerHTML = '<span class="pending">' + nowText + '</span>';
            resDom.textContent = ''; input.disabled = false; input.focus(); updateProgress();
            liveWpm.textContent = '0'; liveCpm.textContent = '0'; liveAcc.textContent = '0%'; liveTime.textContent = '0.0s';
        }

        window.restartTest = function () {
            currentRound = 0; if (timer) clearTimeout(timer); initText();
        };

        function showAllResult() {
            const avgTime = calcAvg(timeList), avgAcc = calcAvg(accList);
            const avgWpm = calcAvg(wpmList), avgCpm = calcAvg(cpmList);
            let grade = { grade: '-', color: '#aaa' };
            if (typeof APEXON !== 'undefined' && APEXON.Utils && APEXON.Utils.getGrade) {
                grade = APEXON.Utils.getGrade(parseFloat(avgTime), 'type');
            } else {
                if (avgTime < 20) grade = { grade: 'S', color: '#FFD700' };
                else if (avgTime < 30) grade = { grade: 'A', color: '#FF6B6B' };
                else if (avgTime < 40) grade = { grade: 'B', color: '#4ECDC4' };
                else if (avgTime < 50) grade = { grade: 'C', color: '#95E1D3' };
                else grade = { grade: 'D', color: '#aaa' };
            }
            const rows = [];
            for (let i = 0; i < TOTAL_ROUNDS; i++) {
                rows.push('<div class="score-detail-item"><div class="score-detail-value">' + timeList[i] + 's</div><div class="score-detail-label">第' + (i + 1) + '轮 ' + accList[i] + '%</div></div>');
            }
            resDom.innerHTML = '<div class="score-card"><div class="score-grade" style="color:' + grade.color + '">' + grade.grade + '</div><div class="score-label">平均用时 ' + avgTime + ' 秒 · 正确率 ' + avgAcc + '%</div><div class="score-details"><div class="score-detail-item"><div class="score-detail-value">' + avgWpm + '</div><div class="score-detail-label">WPM</div></div><div class="score-detail-item"><div class="score-detail-value">' + avgCpm + '</div><div class="score-detail-label">CPM</div></div><div class="score-detail-item"><div class="score-detail-value">' + avgTime + 's</div><div class="score-detail-label">平均用时</div></div><div class="score-detail-item"><div class="score-detail-value">' + avgAcc + '%</div><div class="score-detail-label">正确率</div></div></div><div class="score-details" style="margin-top:12px">' + rows.join('') + '</div></div>';
            if (typeof APEXON !== 'undefined' && APEXON.Account && APEXON.Account.isLoggedIn()) {
                APEXON.Storage.saveRecord('type', { avg: avgTime, accuracy: avgAcc, wpm: avgWpm, cpm: avgCpm });
            }
            try { if (typeof APEXON !== 'undefined' && APEXON.Audio) APEXON.Audio.playSuccess(); } catch(e){}
            try { if (navigator.vibrate) navigator.vibrate(30); } catch(e){}
            renderHistory();
        }

        function completeRound(timeS, accuracy, wpm, cpm) {
            timeList.push(timeS); accList.push(accuracy); wpmList.push(wpm); cpmList.push(cpm);
            currentRound++; input.disabled = true;
            if (currentRound >= TOTAL_ROUNDS) showAllResult();
            else {
                resDom.innerHTML = '<strong>本轮用时：' + timeS + ' 秒</strong> &nbsp;&nbsp; 正确率：' + accuracy + '% &nbsp;&nbsp; WPM：' + wpm;
                timer = setTimeout(() => { input.disabled = false; initText(); }, ROUND_DELAY_MS);
            }
        }

        input.addEventListener('input', () => {
            if (!isStart) { isStart = true; startTime = performance.now(); }
            const inputVal = input.value; let right = 0, showHtml = '';
            for (let i = 0; i < nowText.length; i++) {
                if (i < inputVal.length) {
                    const isCorrect = inputVal[i] === nowText[i];
                    showHtml += isCorrect ? '<span class="right">' + nowText[i] + '</span>' : '<span class="wrong">' + nowText[i] + '</span>';
                    if (isCorrect) right++;
                } else { showHtml += '<span class="pending">' + nowText[i] + '</span>'; }
            }
            box.innerHTML = showHtml; updateLiveStats(inputVal, right);
            const inputChineseLen = getValidChineseCount(inputVal);
            const targetLen = getValidChineseCount(nowText);
            if (inputChineseLen >= targetLen) {
                const elapsed = (performance.now() - startTime) / MS_PER_SECOND;
                const timeS = elapsed.toFixed(1);
                const accuracy = ((right / nowText.length) * 100).toFixed(1);
                const chineseCount = getValidChineseCount(inputVal);
                const cpm = elapsed > 0 ? (chineseCount / elapsed * 60).toFixed(0) : 0;
                const wpm = elapsed > 0 ? (chineseCount / elapsed * 60 / 5).toFixed(0) : 0;
                completeRound(timeS, accuracy, wpm, cpm);
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.ctrlKey && (e.key.toLowerCase() === 'c' || e.key.toLowerCase() === 'v')) { e.preventDefault(); return false; }
            if (e.key === 'Escape') backHome();
            if (e.key === 'r' || e.key === 'R') { if (e.ctrlKey) return; restartTest(); }
        });
        input.addEventListener('paste', (e) => { e.preventDefault(); return false; });
        box.addEventListener('contextmenu', (e) => e.preventDefault());

        if (typeof APEXON !== 'undefined' && APEXON.Visibility && APEXON.Visibility.onChange) {
            APEXON.Visibility.onChange((visible) => {
                if (!visible && isStart && currentRound < TOTAL_ROUNDS) { input.disabled = true; resDom.textContent = '测试已暂停'; }
            });
        }

        renderHistory();
        initText();
        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

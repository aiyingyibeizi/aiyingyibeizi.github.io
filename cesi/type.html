<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打字训练测试 - APEXON</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <canvas id="particles"></canvas>
    <header class="apexon-header">
        <div class="apexon-header__inner">
            <a href="index.html" class="apexon-header-logo">
                <img src="assets/favicon.png" alt="Logo">
                <span>APEXON</span>
            </a>
            <button class="apexon-menu-btn" onclick="toggleMenu()" aria-label="打开菜单">☰</button>
            <nav class="apexon-header-nav" id="headerNav">
                <a href="index.html">首页</a>
                <a href="reaction.html">反应测试</a>
                <a href="type.html" class="active">打字测试</a>
                <a href="stick.html">注意力测试</a>
                <a href="number.html">数字记忆</a>
                <a href="verbal.html">单词记忆</a>
                <a href="visual.html">视觉记忆</a>
                <a href="aim.html">瞄准训练</a>
                <a href="sequence.html">序列记忆</a>
            </nav>
            <div class="header-actions">
                <label class="apex-bw-toggle" id="bwToggle" title="切换深色/明亮主题">
                    <input type="checkbox" id="bwToggleInput" aria-label="切换黑白模式">
                    <span class="apex-bw-toggle__track">
                        <span class="apex-bw-toggle__thumb">
                            <span class="apex-bw-toggle__icon" id="bwToggleIcon">🌈</span>
                        </span>
                    </span>
                </label>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>打字训练测试</h1>

        <div class="progress-wrap">
            <div class="progress-label"><span>进度</span><span id="progressText">0 / 5</span></div>
            <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        </div>

        <div class="live-stats" id="liveStats">
            <div class="live-stat-item"><div class="live-stat-value" id="liveWpm">0</div><div class="live-stat-label">WPM</div></div>
            <div class="live-stat-item"><div class="live-stat-value" id="liveCpm">0</div><div class="live-stat-label">CPM</div></div>
            <div class="live-stat-item"><div class="live-stat-value" id="liveAcc">0%</div><div class="live-stat-label">正确率</div></div>
            <div class="live-stat-item"><div class="live-stat-value" id="liveTime">0.0s</div><div class="live-stat-label">用时</div></div>
        </div>

        <div class="type-hint-bar" id="typeHint">准备开始</div>
        <div id="testBox" class="type-test-area"></div>
        <textarea id="inputArea" placeholder="在这里打字..."></textarea>

        <div class="result" id="result"></div>

        <div class="btn-group">
            <button class="btn" onclick="restartTest()">重新开始</button>
            <button class="btn" onclick="backHome()">返回主界面</button>
        </div>

        <div class="history-list" style="margin-top:24px">
            <div class="history-title">最近记录</div>
            <div id="historyContent">还没有记录</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
    (function () {
        window.toggleMenu = function () {
            document.getElementById('headerNav').classList.toggle('open');
        };
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.apexon-header')) document.getElementById('headerNav').classList.remove('open');
        });

        // 粒子背景
        APEXON.Particles.init();

        // 初始化打字测试引擎
        if (APEXON.Tests && APEXON.Tests.Type && typeof APEXON.Tests.Type.init === 'function') {
            APEXON.Tests.Type.init();
        } else {
            document.getElementById('result').textContent = '测试引擎加载失败，请刷新页面重试。';
        }

        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

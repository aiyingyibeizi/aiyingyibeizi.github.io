<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="typeTitle">打字训练测试 - APEXON</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
<!-- Clarity tracking code for https://apexon.qzz.io -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xlclo5ihkp");
</script>
</head>
<body>
    <canvas id="particles"></canvas>
    <header class="apexon-header">
        <div class="apexon-header__inner">
            <a href="index.html" class="apexon-header-logo">
                <img src="assets/favicon.png" alt="Logo">
                <span>APEXON</span>
            </a>
            <button class="apexon-menu-btn" onclick="toggleMenu()" data-i18n-title="menuOpen" aria-label="打开菜单">☰</button>
            <nav class="apexon-header-nav" id="headerNav">
                <a href="index.html" class="" data-i18n="navHome">首页</a>
                <a href="reaction.html" class="" data-i18n="navReaction">反应测试</a>
                <a href="type.html" class="active" data-i18n="navType">打字测试</a>
                <a href="stick.html" class="" data-i18n="navStick">注意力测试</a>
                <a href="number.html" class="" data-i18n="navNumber">数字记忆</a>
                <a href="verbal.html" class="" data-i18n="navVerbal">单词记忆</a>
                <a href="visual.html" class="" data-i18n="navVisual">视觉记忆</a>
                <a href="aim.html" class="" data-i18n="navAim">瞄准训练</a>
                <a href="sequence.html" class="" data-i18n="navSequence">序列记忆</a>
            </nav>
            <div class="header-actions">
                <label class="apex-bw-toggle" id="bwToggle" data-i18n-title="themeToggle" title="切换深色/明亮主题">
                    <input type="checkbox" id="bwToggleInput" data-i18n-aria-label="themeToggle" aria-label="切换主题">
                    <span class="apex-bw-toggle__track">
                        <span class="apex-bw-toggle__thumb">
                            <span class="apex-bw-toggle__icon" id="bwToggleIcon">🌈</span>
                        </span>
                    </span>
                </label>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 data-i18n="typeTitle">打字训练测试</h1>

        <div class="progress-wrap">
            <div class="progress-label"><span data-i18n="progressLabel">进度</span><span id="progressText">0 / 5</span></div>
            <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        </div>

        <div class="live-stats" id="liveStats">
            <div class="live-stat-item"><div class="live-stat-value" id="liveWpm">0</div><div class="live-stat-label" data-i18n="wpmLabel">WPM</div></div>
            <div class="live-stat-item"><div class="live-stat-value" id="liveCpm">0</div><div class="live-stat-label" data-i18n="cpmLabel">CPM</div></div>
            <div class="live-stat-item"><div class="live-stat-value" id="liveAcc">0%</div><div class="live-stat-label" data-i18n="accuracyLabel">正确率</div></div>
            <div class="live-stat-item"><div class="live-stat-value" id="liveTime">0.0s</div><div class="live-stat-label" data-i18n="timeLabel">用时</div></div>
        </div>

        <div class="type-hint-bar" id="typeHint" data-i18n="readyStart">准备开始</div>
        <div id="testBox" class="type-test-area"></div>
        <textarea id="inputArea" data-i18n-placeholder="typeHerePlaceholder" placeholder="在这里打字..."></textarea>

        <div class="result" id="result"></div>

        <div class="btn-group">
            <button class="btn" onclick="restartTest()" data-i18n="restart">重新开始</button>
            <button class="btn" onclick="backHome()" data-i18n="backHome">返回主界面</button>
        </div>

        <div class="history-list" style="margin-top:24px">
            <div class="history-title" data-i18n="recentRecords">最近记录</div>
            <div id="historyContent" data-i18n="noRecords">还没有记录</div>
        </div>
    </div>

    <script src="js/i18n.js?v=2"></script>
    <script src="js/common.js?v=10"></script>
    <script>
    (function () {
        const t = window.APEXON && APEXON.i18n ? APEXON.i18n.t.bind(APEXON.i18n) : function(k, fb){ return fb; };

        window.toggleMenu = function () {
            document.getElementById('headerNav').classList.toggle('open');
        };
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.apexon-header')) document.getElementById('headerNav').classList.remove('open');
        });

        // 粒子背景
        APEXON.Particles.init();

        // 初始化打字测试引擎
        if (APEXON.Tests && APEXON.Tests.Type && typeof APEXON.Tests.Type.init === 'function') {
            APEXON.Tests.Type.init();
        } else {
            document.getElementById('result').textContent = t('engineLoadFailed', '测试引擎加载失败，请刷新页面重试。');
        }

        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

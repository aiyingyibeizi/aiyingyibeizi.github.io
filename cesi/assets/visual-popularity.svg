<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="160" height="110" role="img" aria-label="Popularity">
  <defs>
    <linearGradient id="pCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#251839"/>
      <stop offset="1" stop-color="#0d0818"/>
    </linearGradient>
    <linearGradient id="pGold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="0.28" stop-color="#ffd964"/>
      <stop offset="0.62" stop-color="#f4b323"/>
      <stop offset="1" stop-color="#a85c05"/>
    </linearGradient>
    <linearGradient id="pGoldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.55" stop-color="#ffd964"/>
      <stop offset="1" stop-color="#e79a12"/>
    </linearGradient>
    <linearGradient id="pRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="pBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="pSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="312" height="212" rx="34" fill="url(#pCard)"/>
  <rect x="4.75" y="4.75" width="310.5" height="210.5" rx="33.25" fill="none" stroke="url(#pRim)" stroke-width="1.5"/>
  <ellipse cx="160" cy="124" rx="104" ry="86" fill="url(#pGlow)"/>

  <!-- 奖杯 -->
  <g>
    <ellipse cx="160" cy="188" rx="52" ry="10" fill="#000000" opacity="0.45" filter="url(#pBlur)"/>

    <!-- 把手 -->
    <path d="M122 88 C96 86 94 122 122 128" fill="none" stroke="url(#pGold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M198 88 C224 86 226 122 198 128" fill="none" stroke="url(#pGold)" stroke-width="9" stroke-linecap="round"/>

    <!-- 杯身 -->
    <path d="M118 70 H202 L193 126 C189 147 176 157 160 157 C144 157 131 147 127 126 Z" fill="url(#pGold)"/>
    <path d="M118 70 H202 L193 126 C189 147 176 157 160 157 C144 157 131 147 127 126 Z" fill="none" stroke="#7c3f00" stroke-opacity="0.45" stroke-width="1.2"/>
    <!-- 杯口 -->
    <rect x="112" y="62" width="96" height="14" rx="7" fill="url(#pGoldLight)"/>
    <rect x="112" y="62" width="96" height="14" rx="7" fill="none" stroke="#fffbe0" stroke-opacity="0.5" stroke-width="1"/>
    <!-- 高光与暗面 -->
    <path d="M134 80 C132 106 136 128 146 143" fill="none" stroke="#fffbe0" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" filter="url(#pSoft)"/>
    <path d="M184 82 C188 110 182 132 172 146" fill="none" stroke="#7c3f00" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round" filter="url(#pSoft)"/>
    <!-- 杯身刻字 -->
    <path d="M147 104 L152 118 L160 98 L168 118 L173 104" fill="none" stroke="#7c3f00" stroke-opacity="0.35" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 杯柱与底座 -->
    <rect x="151" y="157" width="18" height="14" fill="url(#pGold)"/>
    <path d="M132 184 H188 L196 197 H124 Z" fill="url(#pGold)"/>
    <rect x="124" y="178" width="72" height="8" rx="4" fill="url(#pGoldLight)"/>
    <rect x="124" y="178" width="72" height="8" rx="4" fill="none" stroke="#7c3f00" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- 星光 -->
  <g fill="#ffe9a3">
    <path d="M242 66 l3.2 9.8 9.8 3.2 -9.8 3.2 -3.2 9.8 -3.2 -9.8 -9.8 -3.2 9.8 -3.2 Z" opacity="0.9"/>
    <path d="M78 52 l2.4 7.2 7.2 2.4 -7.2 2.4 -2.4 7.2 -2.4 -7.2 -7.2 -2.4 7.2 -2.4 Z" opacity="0.65"/>
    <path d="M250 140 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z" opacity="0.5"/>
  </g>
  <circle cx="86" cy="118" r="2.4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="236" cy="104" r="1.8" fill="#fde68a" opacity="0.7"/>
</svg>

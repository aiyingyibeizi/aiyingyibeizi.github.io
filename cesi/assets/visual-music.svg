<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="160" height="110" role="img" aria-label="Music">
  <defs>
    <linearGradient id="mCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a3d"/>
      <stop offset="1" stop-color="#080a16"/>
    </linearGradient>
    <linearGradient id="mSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef0ff"/>
      <stop offset="0.45" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#ff8ad8"/>
    </linearGradient>
    <radialGradient id="mDisc" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#2a2b4d"/>
      <stop offset="0.55" stop-color="#141527"/>
      <stop offset="1" stop-color="#080912"/>
    </radialGradient>
    <linearGradient id="mLabel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ef2ff"/>
      <stop offset="0.5" stop-color="#8b7efc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="mGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="mBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="mSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- 背景满出血：容器负责圆角裁切，避免四周露出浅色细边 -->
  <rect x="0" y="0" width="320" height="220" fill="url(#mCard)"/>
  <ellipse cx="130" cy="112" rx="96" ry="82" fill="url(#mGlow)"/>

  <!-- 黑胶唱片 -->
  <g transform="translate(122 112)">
    <ellipse cx="0" cy="6" rx="64" ry="62" fill="#05060d" opacity="0.85" filter="url(#mBlur)"/>
    <circle r="62" fill="url(#mDisc)"/>
    <circle r="62" fill="none" stroke="url(#mSheen)" stroke-opacity="0.85" stroke-width="2.6"/>
    <g fill="none" stroke="#ffffff">
      <circle r="53" stroke-opacity="0.055" stroke-width="1.1"/>
      <circle r="46" stroke-opacity="0.075" stroke-width="1.1"/>
      <circle r="39" stroke-opacity="0.06" stroke-width="1.1"/>
      <circle r="32" stroke-opacity="0.05" stroke-width="1.1"/>
    </g>
    <!-- 镜面高光 -->
    <path d="M38 40 A55 55 0 0 1 -6 61" fill="none" stroke="url(#mSheen)" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/>
    <circle r="19" fill="url(#mLabel)"/>
    <circle r="19" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="4.2" fill="#06070f"/>
  </g>

  <!-- 音符 -->
  <g transform="translate(224 52)">
    <g filter="url(#mSoft)" opacity="0.55">
      <path d="M0 30 V4 L26 -4 V22" fill="none" stroke="url(#mSheen)" stroke-width="6" stroke-linecap="round"/>
    </g>
    <path d="M0 30 V4 L26 -4 V22" fill="none" stroke="url(#mSheen)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-4" cy="31" rx="8.5" ry="6.4" transform="rotate(-16 -4 31)" fill="url(#mSheen)"/>
    <ellipse cx="22" cy="23" rx="8.5" ry="6.4" transform="rotate(-16 22 23)" fill="url(#mSheen)"/>
  </g>

  <!-- 声波 -->
  <g transform="translate(228 150)" fill="url(#mSheen)">
    <rect x="0" y="14" width="4" height="16" rx="2" opacity="0.5"/>
    <rect x="10" y="6" width="4" height="32" rx="2" opacity="0.8"/>
    <rect x="20" y="0" width="4" height="44" rx="2"/>
    <rect x="30" y="9" width="4" height="26" rx="2" opacity="0.75"/>
    <rect x="40" y="16" width="4" height="12" rx="2" opacity="0.45"/>
  </g>
  <circle cx="262" cy="56" r="3" fill="#8ef2ff" opacity="0.9"/>
  <circle cx="278" cy="72" r="1.8" fill="#f472b6" opacity="0.8"/>
</svg>

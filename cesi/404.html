<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - 页面未找到 | APEXON</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles/variables.css?v=8">
    <link rel="stylesheet" href="styles/main.css?v=21">
    <style>
        .notfound {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 62vh;
            padding: 40px 16px 56px;
        }
        .notfound__code {
            font-size: 118px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #a5a2fd 0%, #34d399 60%, #22d3ee 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .notfound__icon {
            font-size: 40px;
            margin-top: 6px;
        }
        .notfound__title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--apex-text);
            margin: 18px 0 10px;
        }
        .notfound__desc {
            color: var(--apex-text-secondary);
            font-size: 0.95rem;
            max-width: 460px;
            line-height: 1.7;
            margin: 0 auto 26px;
        }
        .notfound__actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .notfound__actions .btn {
            text-decoration: none;
            min-width: 128px;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <header class="apexon-header">
        <div class="apexon-header__inner">
            <div class="apexon-header-left">
                <a href="index.html" class="apexon-header-logo nav-main" draggable="false" ondragstart="return false" onselectstart="return false">
                    <img src="assets/favicon.png" alt="Logo" draggable="false">
                    <span>APEXON</span>
                </a>
                <label class="apex-bw-toggle" id="bwToggle" data-i18n-title="themeToggle" title="切换深色/明亮主题">
                    <input type="checkbox" id="bwToggleInput" data-i18n-aria-label="themeToggle" aria-label="切换主题">
                    <span class="apex-bw-toggle__track">
                        <span class="apex-bw-toggle__thumb">
                            <span class="apex-bw-toggle__icon" id="bwToggleIcon">🌈</span>
                        </span>
                    </span>
                </label>
            </div>
            <div class="apexon-header-center">
                <button class="apexon-menu-btn" onclick="toggleMenu()" data-i18n-title="menuOpen" aria-label="打开菜单">☰</button>
                <nav class="apexon-header-nav" id="headerPill">
                    <a href="index.html" class="nav-main" data-i18n="navHome">首页</a>
                </nav>
                <a href="music.html" class="apex-music-btn" data-i18n="navMusic">Music</a>
            </div>
            <div class="header-actions" style="position: relative;">
                <button class="apex-palette-btn" title="切换主题配色">🎨</button>
                <div class="apex-palette-panel" hidden>
                    <h6>主题配色</h6>
                    <div class="apex-palette-row">
                        <div class="apex-palette-swatch" data-accent="cyan" style="background:#8b7efc;"></div>
                        <div class="apex-palette-swatch" data-accent="emerald" style="background:#34d399;"></div>
                        <div class="apex-palette-swatch" data-accent="amber" style="background:#fbbf24;"></div>
                        <div class="apex-palette-swatch" data-accent="rose" style="background:#f472b6;"></div>
                        <div class="apex-palette-swatch" data-accent="indigo" style="background:#818cf8;"></div>
                        <div class="apex-palette-swatch" data-accent="coral" style="background:#fb923c;"></div>
                        <div class="apex-palette-swatch" data-accent="sunset" style="background:#f97316;"></div>
                        <div class="apex-palette-swatch" data-accent="mint" style="background:#2dd4bf;"></div>
                        <div class="apex-palette-swatch" data-accent="crimson" style="background:#f43f5e;"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="notfound">
            <div class="notfound__icon">🛸</div>
            <div class="notfound__code">404</div>
            <h1 class="notfound__title">页面未找到</h1>
            <p class="notfound__desc">你访问的页面可能已被移动、删除，或输入的地址有误。别担心，宇航局仍在正常运行——你可以回到首页继续你的认知冒险。</p>
            <div class="notfound__actions">
                <a href="index.html" class="btn">返回首页</a>
                <a href="music.html" class="btn">探索音乐</a>
                <a href="search.html" class="btn">站内搜索</a>
            </div>
        </div>
    </div>

    <script src="js/i18n.js?v=13"></script>
    <script src="js/common.js?v=34"></script>
    <script>
    (function () {
        if (window.APEXON && APEXON.Particles) APEXON.Particles.init();
        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>瞄准训练 - APEXON</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        #testBox {
            position: relative;
            min-height: 360px;
            overflow: hidden;
            padding: 0;
        }
        #testBox .aim-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            z-index: 1;
        }
        #testBox .aim-target {
            position: absolute;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff9a9e, #f43f5e);
            box-shadow: 0 4px 14px rgba(244, 63, 94, 0.45);
            cursor: pointer;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease;
        }
        #testBox .aim-target::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
        }
        #testBox .aim-target:active {
            transform: translate(-50%, -50%) scale(0.92);
        }
    </style>
    <!-- Clerk 登录系统（已临时禁用，取消注释即可恢复）
    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_c3Rhci1zdG9yay00LmNsZXJrLmFjY291bnRzLmRldiQ"

</head>
<body>
    <header class="apexon-header">
        <div class="apexon-header__inner">
            <a href="index.html" class="apexon-header-logo">
                <img src="assets/favicon.png" alt="Logo">
                <span>APEXON</span>
            </a>
            <button class="apexon-menu-btn" onclick="toggleMenu()" aria-label="打开菜单">☰</button>
            <nav class="apexon-header-nav" id="headerNav">
                <a href="index.html">首页</a>
                <a href="reaction.html">反应测试</a>
                <a href="type.html">打字测试</a>
                <a href="stick.html">注意力测试</a>
                <a href="number.html">数字记忆</a>
                <a href="verbal.html">单词记忆</a>
                <a href="visual.html">视觉记忆</a>
                <a href="aim.html" class="active">瞄准训练</a>
                <a href="sequence.html">序列记忆</a>
            </nav>
            <div class="header-actions">
                <label class="apex-bw-toggle" id="bwToggle" title="切换深色/明亮主题">
                    <input type="checkbox" id="bwToggleInput" aria-label="切换黑白模式">
                    <span class="apex-bw-toggle__track">
                        <span class="apex-bw-toggle__thumb">
                            <span class="apex-bw-toggle__icon" id="bwToggleIcon"></span>
                        </span>
                    </span>
                </label>
                <!-- Clerk 官方 UserButton 挂载点（已临时禁用，取消注释即可恢复）
                <div class="header-user-wrap" id="headerUserWrap">
                    <div id="user-menu-container"></div>
                    <span class="header-user-login" id="headerUserLogin">
                        <svg class="header-user-avatar header-user-avatar--guest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
                        </svg>
                        <span>登录</span>
                    </span>
                    <span class="header-user-name" id="headerUserName"></span>
                </div>
                -->
            </div>
        </div>
    </header>

    <div class="container">
        <h1>瞄准训练</h1>

        <div class="info-row">剩余目标：<span id="remainingDisplay">30</span>　当前平均：<span id="avgDisplay">0</span> ms</div>

        <div id="testBox" data-test-type="aim">
            <div class="aim-overlay">点击开始<br><span style="font-size:0.75em;font-weight:400">尽快点击 30 个目标</span></div>
        </div>

        <div class="result" id="result"></div>

        <div class="btn-group">
            <button class="btn" onclick="restartTest()">再来一次</button>
            <button class="btn" onclick="backHome()">返回主界面</button>
        </div>

        <div class="history-list" style="margin-top:24px">
            <div class="history-title">最近记录</div>
            <div id="historyContent">还没有记录</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
    (function () {
        window.toggleMenu = function () {
            document.getElementById('headerNav').classList.toggle('open');
        };
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.apexon-header')) document.getElementById('headerNav').classList.remove('open');
        });

        /* 登录系统已临时禁用，取消注释即可恢复
        APEXON.UI.mountUserButton('user-menu-container');
        */

        const testBox = document.getElementById('testBox');
        const result = document.getElementById('result');
        const historyContent = document.getElementById('historyContent');
        const remainingDisplay = document.getElementById('remainingDisplay');
        const avgDisplay = document.getElementById('avgDisplay');

        const TOTAL_TARGETS = 30;
        const TARGET_SIZE = 46;

        let state = 'idle';
        let remaining = TOTAL_TARGETS;
        let totalMs = 0;
        let targetSpawnTime = 0;

        function playSuccess() { try { if (APEXON.Audio) APEXON.Audio.playSuccess(); } catch (e) {} }

        function renderHistory() {
            /* 登录系统已临时禁用，取消下方块注释即可恢复
            if (!APEXON.Auth.isLoggedIn()) {
                historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">登录后同步云端记录</div>';
                return;
            }
            APEXON.DB.getHistoryByUserAndType(APEXON.Auth.getUserId(), 'aim', 5).then(history => {
                const esc = APEXON.Security.escapeHtml;
                if (!history.length) {
                    historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">还没有记录</div>';
                    return;
                }
                historyContent.innerHTML = history.map(h => '<div class="history-item"><span class="history-date">' + esc(h.date || new Date(h.timestamp).toLocaleDateString('zh-CN')) + '</span><span class="history-score">' + esc(h.avg) + ' ms</span></div>').join('');
            }).catch(() => {
                historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">加载记录失败</div>';
            });
            */
            historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">登录系统维护中</div>';
        }

        function updateStats() {
            remainingDisplay.textContent = remaining;
            const avg = remaining >= TOTAL_TARGETS ? 0 : (totalMs / (TOTAL_TARGETS - remaining));
            avgDisplay.textContent = Math.round(avg);
        }

        function spawnTarget() {
            const rect = testBox.getBoundingClientRect();
            const w = Math.max(TARGET_SIZE, rect.width - TARGET_SIZE);
            const h = Math.max(TARGET_SIZE, rect.height - TARGET_SIZE);
            const left = TARGET_SIZE / 2 + Math.random() * w;
            const top = TARGET_SIZE / 2 + Math.random() * h;
            const target = document.createElement('div');
            target.className = 'aim-target';
            target.style.left = left + 'px';
            target.style.top = top + 'px';
            target.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if (state !== 'running') return;
                const now = performance.now();
                totalMs += (now - targetSpawnTime);
                target.remove();
                remaining--;
                updateStats();
                playSuccess();
                try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
                if (remaining <= 0) endGame();
                else {
                    targetSpawnTime = performance.now();
                    spawnTarget();
                }
            });
            testBox.appendChild(target);
            targetSpawnTime = performance.now();
        }

        function endGame() {
            state = 'ended';
            const avg = totalMs / TOTAL_TARGETS;
            const avgMs = Math.round(avg);
            const grade = APEXON.Utils.getGrade(avgMs, 'aim');
            result.innerHTML = '<div class="score-card"><div class="score-grade" style="color:' + grade.color + '">' + grade.grade + '</div><div class="score-label">平均每点 ' + avgMs + ' ms</div><div class="score-details"><div class="score-detail-item"><div class="score-detail-value">' + avgMs + '</div><div class="score-detail-label">平均耗时</div></div><div class="score-detail-item"><div class="score-detail-value">' + TOTAL_TARGETS + '</div><div class="score-detail-label">目标数</div></div><div class="score-detail-item"><div class="score-detail-value">' + grade.grade + '</div><div class="score-detail-label">等级</div></div></div></div>';

            /* 登录系统已临时禁用，取消下方块注释即可恢复
            if (APEXON.Auth.isLoggedIn()) {
                APEXON.DB.saveScore(APEXON.Auth.getUserId(), APEXON.Auth.getUser(), 'aim', { avg: avgMs }).then(saved => {
                    if (!saved) APEXON.UI.toast('数据保存失败，请重试');
                });
            }
            */
            try { if (navigator.vibrate) navigator.vibrate(50); } catch (e) {}
            renderHistory();
        }

        function startTest() {
            if (state !== 'idle') return;
            state = 'running';
            remaining = TOTAL_TARGETS;
            totalMs = 0;
            updateStats();
            result.innerHTML = '';
            const overlay = testBox.querySelector('.aim-overlay');
            if (overlay) overlay.remove();
            targetSpawnTime = performance.now();
            spawnTarget();
        }

        window.restartTest = function () {
            state = 'idle';
            remaining = TOTAL_TARGETS;
            totalMs = 0;
            updateStats();
            result.innerHTML = '';
            testBox.innerHTML = '<div class="aim-overlay">点击开始<br><span style="font-size:0.75em;font-weight:400">尽快点击 30 个目标</span></div>';
            renderHistory();
        };

        testBox.addEventListener('click', (e) => {
            if (state === 'idle') startTest();
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if ((e.key === ' ' || e.key === 'Enter') && state === 'idle') { e.preventDefault(); startTest(); }
            if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey) restartTest();
        });

        renderHistory();
        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

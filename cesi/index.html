<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <link rel="icon" type="image/x-icon" href="apexon.png">
    <link rel="shortcut icon" type="image/x-icon" href="apexon.png">
    <meta name="robots" content="noindex, nofollow">
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key == 'F12' || (e.ctrlKey && e.key == 'u') || (e.ctrlKey && e.shiftKey && e.key == 'I')) e.preventDefault();
        });
    </script>

    <meta charset="UTF-8">
    <title>Apexon测试</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 30px 20px;
            background: #f0f0f0;
            overflow-y: auto;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .search-box input {
            width: 450px;
            height: 44px;
            font-size: 16px;
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 6px 0 0 6px;
            outline: none;
        }

        .search-box button {
            height: 46px;
            font-size: 16px;
            padding: 0 20px;
            border: none;
            background: #222;
            color: white;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
        }

        .item-card {
            display: block;
            text-decoration: none;
            width: 100%;
            background: #fff;
            margin-bottom: 15px;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            font-size: 20px;
            color: #222;
            transition: 0.2s;
        }

        .item-card:hover {
            background: #e8e8e8;
        }
    </style>
</head>

<body>
    <div style="position:fixed;top:36px;left:44px;z-index:9999;">
        <img src="apexon.png" style="height:84px;border-radius:20px;">
    </div>

    <div class="container">
        <h1>APEXON全能能力测试 主界面</h1>

        <form class="search-box" action="https://www.bing.com/search" method="get" target="_blank">
            <input name="q" placeholder="输入关键词，搜索全世界" required autocomplete="off" autofocus>
            <button type="submit">搜索</button>
        </form>

        <a href="reaction.html" class="item-card">反应时间测试</a>
        <a href="type.html" class="item-card">打字训练测试</a>
        <a href="stick.html" class="item-card">持续注意力测试</a>
    </div>
</body>

</html>

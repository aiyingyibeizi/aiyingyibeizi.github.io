<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>APEXON — 全能能力测试</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="particles"></canvas>

    <!-- 登录/注册弹窗 -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <img src="assets/favicon.png" alt="Logo" class="auth-logo">
            <button style="position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:transparent;border-radius:50%;cursor:pointer;font-size:20px;color:#94a3b8;transition:color 0.2s;" onclick="hideAuth()" onmouseover="this.style.color='#64748b'" onmouseout="this.style.color='#94a3b8'">✕</button>
            <h2 id="authTitle">欢迎来到 APEXON</h2>
            <div class="auth-sub">测试你的极限能力</div>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')" id="tabLogin">登录</button>
                <button class="auth-tab" onclick="switchTab('register')" id="tabRegister">注册</button>
            </div>
            <div id="authFormLogin">
                <input type="text" class="auth-input" id="loginUser" placeholder="用户名" maxlength="20">
                <input type="password" class="auth-input" id="loginPass" placeholder="密码" maxlength="30">
                <label class="remember-row">
                    <input type="checkbox" id="loginRemember" checked>
                    <span>30天内自动登录</span>
                </label>
                <div class="auth-error" id="loginError"></div>
                <button class="auth-btn" onclick="handleLogin()">登录</button>
            </div>
            <div id="authFormRegister" style="display:none">
                <input type="text" class="auth-input" id="regUser" placeholder="用户名（2-20位）" maxlength="20">
                <input type="password" class="auth-input" id="regPass" placeholder="密码（至少8位，含字母+数字）" maxlength="30">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-text" id="strengthText"></div>
                <input type="password" class="auth-input" id="regPass2" placeholder="确认密码" maxlength="30">
                <div class="auth-error" id="regError"></div>
                <button class="auth-btn" onclick="handleRegister()">注册并登录</button>
            </div>
            <div class="auth-hint">数据保存在本机浏览器中，更换设备需重新注册</div>
        </div>
    </div>

    <header class="apexon-header">
        <a href="index.html" class="apexon-header-logo">
            <img src="assets/favicon.png" alt="Logo">
            <span>APEXON</span>
        </a>
        <button class="apexon-menu-btn" onclick="toggleMenu()">☰</button>
        <nav class="apexon-header-nav" id="headerNav">
            <a href="index.html" class="active">首页</a>
            <a href="reaction.html">反应测试</a>
            <a href="type.html">打字测试</a>
            <a href="stick.html">注意力测试</a>
        </nav>
        <div class="user-dropdown-wrap" id="userDropdownWrap" style="display:none">
            <button class="user-btn" onclick="toggleUserMenu()">
                <span class="user-avatar" id="userAvatar">A</span>
                <span id="userName">用户</span>
            </button>
            <div class="user-menu" id="userMenu">
                <div class="user-menu-item" style="cursor:default;color:#64748b;font-size:12px;">已登录：<strong id="menuUserName">用户</strong></div>
                <div class="user-menu-hr"></div>
                <button class="user-menu-item" onclick="APEXON.logout()">退出登录</button>
                <button class="user-menu-item danger" onclick="APEXON.deleteAccount()">注销账号</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="hero-apexon">
            <img src="assets/favicon.png" alt="Logo" class="hero-logo-main">
            <div class="hero-title-main">APEXON</div>
            <div class="hero-tagline">全能能力测试系统 · 挑战人类极限</div>
            <div class="hero-stats-bar">
                <div class="hero-stat-chip"><strong id="statUserCount">0</strong> 位玩家</div>
                <div class="hero-stat-chip"><strong id="statTestCount">0</strong> 次测试</div>
                <div class="hero-stat-chip"><strong id="statOnline">在线</strong></div>
            </div>
        </div>

        <form class="search-box" action="https://www.bing.com/search" method="get" target="_blank">
            <input name="q" placeholder="输入关键词，搜索全世界" required>
            <button type="submit">搜索</button>
        </form>

        <a href="reaction.html" class="item-card">
            <strong>反应时间测试</strong>
            <div class="card-desc">测试你的神经反应速度，毫秒级精准测量</div>
        </a>
        <a href="type.html" class="item-card">
            <strong>打字训练测试</strong>
            <div class="card-desc">提升打字速度与准确度，挑战中文输入极限</div>
        </a>
        <a href="stick.html" class="item-card">
            <strong>持续注意力测试</strong>
            <div class="card-desc">60秒专注力挑战，追踪你的注意力曲线</div>
        </a>

        <div class="leaderboard" id="leaderboard">
            <div class="leaderboard-title">🏆 排行榜</div>
            <div class="leaderboard-tabs">
                <button class="leaderboard-tab active" onclick="showLb('reaction')">反应</button>
                <button class="leaderboard-tab" onclick="showLb('type')">打字</button>
                <button class="leaderboard-tab" onclick="showLb('stick')">注意力</button>
            </div>
            <div id="lbContent">还没有人上榜</div>
        </div>

        <div class="personal-stats" id="personalStats">
            <div class="personal-stats-title">📊 我的成绩</div>
            <div id="personalContent">登录后查看</div>
        </div>

        <div class="forum-section" id="forumSection">
            <div class="forum-title">💬 玩家讨论区</div>
            <div id="forumLoginTip" style="color:#94a3b8;font-size:14px;text-align:center;padding:12px;">登录后可以参与讨论</div>
            <div class="forum-input-wrap" id="forumInputWrap" style="display:none">
                <textarea id="forumText" placeholder="分享你的测试心得..." maxlength="500"></textarea>
                <button class="forum-btn" onclick="postComment()">发布</button>
            </div>
            <div class="forum-list" id="forumList"></div>
        </div>

        <div class="feedback-section" id="feedbackSection">
            <div class="feedback-title">📮 反馈与联系</div>
            <div class="feedback-email-box">
                <div class="feedback-email-icon">✉</div>
                <div class="feedback-email-info">
                    <div class="feedback-email-label">站长邮箱</div>
                    <div class="feedback-email-value">luoyangmengjin2025@163.com</div>
                </div>
            </div>
            <div class="feedback-form">
                <input type="text" id="fbName" placeholder="你的姓名">
                <input type="email" id="fbEmail" placeholder="你的邮箱">
                <textarea id="fbContent" placeholder="反馈内容、建议或问题..." maxlength="2000"></textarea>
                <button class="feedback-submit" onclick="submitFeedback()">提交反馈</button>
                <div id="fbMsg" style="font-size:13px;color:var(--primary);margin-top:4px;min-height:18px;"></div>
            </div>
        </div>
    </div>


    <script src="js/common.js"></script>
    <script>
    (function() {
        // ===== 粒子背景 =====
        (function() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            function createParticles() {
                particles = [];
                const count = Math.min(Math.floor(w * h / 18000), 80);
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * w, y: Math.random() * h,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        r: Math.random() * 2 + 0.5
                    });
                }
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(102, 126, 234, 0.25)';
                    ctx.fill();
                }
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        if (d < 100) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = 'rgba(102, 126, 234, ' + (1 - d / 100) * 0.12 + ')';
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            resize(); createParticles(); draw();
            window.addEventListener('resize', () => { resize(); createParticles(); });
        })();

        // ===== 登录/注册 =====
        const authOverlay = document.getElementById('authOverlay');
        const loginUser = document.getElementById('loginUser');
        const loginPass = document.getElementById('loginPass');
        const loginRemember = document.getElementById('loginRemember');
        const regUser = document.getElementById('regUser');
        const regPass = document.getElementById('regPass');
        const regPass2 = document.getElementById('regPass2');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const loginError = document.getElementById('loginError');
        const regError = document.getElementById('regError');

        function showAuth() { authOverlay.classList.add('show'); }
        function hideAuth() { authOverlay.classList.remove('show'); }
        window.showAuth = showAuth;
        window.hideAuth = hideAuth;

        window.switchTab = function(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('authFormLogin').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('authFormRegister').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('authTitle').textContent = tab === 'login' ? '欢迎回来' : '创建账号';
            loginError.textContent = ''; regError.textContent = '';
        };

        regPass.addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (val.length >= 12) score++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            if (/\d/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;
            const colors = ['#e2e8f0', '#ef4444', '#f59e0b', '#22c55e', '#10b981', '#0ea5e9'];
            const texts = ['', '太弱', '一般', '还行', '不错', '很强'];
            const pct = Math.min(score / 5 * 100, 100);
            strengthFill.style.width = pct + '%';
            strengthFill.style.background = colors[score] || colors[0];
            strengthText.textContent = texts[score] || '';
        });

        window.handleLogin = function() {
            const res = APEXON.Account.login(loginUser.value, loginPass.value, loginRemember.checked);
            if (!res.success) { loginError.textContent = res.message; return; }
            hideAuth(); initApp();
        };

        window.handleRegister = function() {
            if (regPass.value !== regPass2.value) { regError.textContent = '两次密码不一致'; return; }
            const res = APEXON.Account.register(regUser.value, regPass.value);
            if (!res.success) { regError.textContent = res.message; return; }
            hideAuth(); initApp();
        };

        [loginUser, loginPass].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); }));
        [regUser, regPass, regPass2].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); }));

        // ===== 用户菜单 =====
        window.toggleUserMenu = function() {
            document.getElementById('userMenu').classList.toggle('show');
        };
        document.addEventListener('click', e => {
            if (!e.target.closest('.user-dropdown-wrap')) document.getElementById('userMenu').classList.remove('show');
        });

        // ===== 应用初始化 =====
        function initApp() {
            const user = APEXON.Account.getUser();
            if (!user) {
                document.getElementById('personalContent').innerHTML = '<div style="color:#94a3b8;text-align:center;padding:20px;cursor:pointer;" onclick="showAuth()">🔒 登录后查看</div>';
                document.getElementById('forumLoginTip').style.display = 'block';
                document.getElementById('forumInputWrap').style.display = 'none';
                loadLeaderboard('reaction');
                loadComments();
                updateStats();
                showAuth();
                return;
            }
            document.getElementById('userDropdownWrap').style.display = 'block';
            document.getElementById('userName').textContent = user;
            document.getElementById('userAvatar').textContent = user.charAt(0).toUpperCase();
            document.getElementById('menuUserName').textContent = user;
            document.getElementById('forumLoginTip').style.display = 'none';
            document.getElementById('forumInputWrap').style.display = 'flex';
            loadLeaderboard('reaction');
            loadPersonal();
            loadComments();
            updateStats();
        }

        function updateStats() {
            try {
                const accounts = JSON.parse(localStorage.getItem('apexon_accounts') || '{}');
                document.getElementById('statUserCount').textContent = Object.keys(accounts).length;
                let totalTests = 0;
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.includes('_history')) {
                        const arr = JSON.parse(localStorage.getItem(key) || '[]');
                        totalTests += arr.length;
                    }
                }
                document.getElementById('statTestCount').textContent = totalTests;
            } catch (e) {}
        }

        // ===== 排行榜 =====
        let currentLb = 'reaction';
        window.showLb = function(type) {
            currentLb = type;
            document.querySelectorAll('.leaderboard-tab').forEach((t, i) => {
                t.classList.toggle('active', ['reaction','type','stick'][i] === type);
            });
            loadLeaderboard(type);
        };
        function loadLeaderboard(type) {
            const esc = APEXON.Security.escapeHtml;
            const entries = APEXON.Storage.getLeaderboard(type, 10);
            if (!entries.length) {
                document.getElementById('lbContent').innerHTML = '<div class="forum-empty">还没有人上榜，快来成为第一个！</div>';
                return;
            }
            const unit = type === 'reaction' ? 'ms' : type === 'type' ? 's' : '分';
            document.getElementById('lbContent').innerHTML = entries.map((e, i) => {
                const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
                const val = e.avg || e.score || 0;
                return '<div class="leaderboard-row"><div class="leaderboard-rank ' + rankClass + '">' + (i + 1) + '</div><div class="leaderboard-name">' + esc(e.user) + '</div><div class="leaderboard-score">' + esc(val) + ' ' + unit + '</div></div>';
            }).join('');
        }

        // ===== 个人成绩 =====
        function loadPersonal() {
            const esc = APEXON.Security.escapeHtml;
            const types = [
                { key: 'reaction', name: '反应', unit: 'ms' },
                { key: 'type', name: '打字', unit: 's' },
                { key: 'stick', name: '注意力', unit: '分' }
            ];
            let html = '<table style="width:100%;border-collapse:collapse">';
            types.forEach(t => {
                const best = APEXON.Storage.getBest(t.key);
                const stats = APEXON.Storage.getStats(t.key);
                const val = best ? (best.avg || best.score) : '-';
                const count = stats ? stats.totalCount : 0;
                html += '<tr><td style="padding:10px 0;border-bottom:1px solid #f1f5f9">' + esc(t.name) + '</td><td style="text-align:right;padding:10px 0;border-bottom:1px solid #f1f5f9"><strong style="color:#334155">' + esc(val) + '</strong> ' + esc(t.unit) + ' · ' + esc(count) + ' 次</td></tr>';
            });
            html += '</table>';
            document.getElementById('personalContent').innerHTML = html;
        }

        // ===== 讨论区 =====
        window.postComment = function() {
            const text = document.getElementById('forumText').value;
            const res = APEXON.Comment.add(text);
            if (!res.success) { alert(res.message); return; }
            document.getElementById('forumText').value = '';
            loadComments();
        };
        function loadComments() {
            const esc = APEXON.Security.escapeHtml;
            const list = APEXON.Comment.get(20);
            if (!list.length) {
                document.getElementById('forumList').innerHTML = '<div class="forum-empty">还没有讨论，来做第一个发言的人吧</div>';
                return;
            }
            document.getElementById('forumList').innerHTML = list.map(c =>
                '<div class="forum-item">' +
                    '<div class="forum-item-header">' +
                        '<div class="forum-item-user">' + esc(c.user) + '</div>' +
                        '<div class="forum-item-time">' + esc(c.time) + '</div>' +
                    '</div>' +
                    '<div class="forum-item-content">' + esc(c.content) + '</div>' +
                '</div>'
            ).join('');
        }

        // ===== 反馈 =====
        window.submitFeedback = function() {
            const name = document.getElementById('fbName').value;
            const email = document.getElementById('fbEmail').value;
            const content = document.getElementById('fbContent').value;
            const msg = document.getElementById('fbMsg');
            if (!name.trim()) { msg.style.color = '#ef4444'; msg.textContent = '请填写姓名'; return; }
            if (!email.trim()) { msg.style.color = '#ef4444'; msg.textContent = '请填写邮箱'; return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.style.color = '#ef4444'; msg.textContent = '邮箱格式不正确'; return; }
            if (!content.trim()) { msg.style.color = '#ef4444'; msg.textContent = '请填写反馈内容'; return; }

            // 同时本地保存记录（不删数据）
            if (typeof APEXON !== 'undefined' && APEXON.Feedback) {
                APEXON.Feedback.add(name, email, content);
            }

            const subject = encodeURIComponent('APEXON 反馈');
            const body = encodeURIComponent('姓名：' + name + '\n邮箱：' + email + '\n\n反馈内容：\n' + content);
            window.location.href = 'mailto:luoyangmengjin2025@163.com?subject=' + subject + '&body=' + body;
            msg.style.color = '#22c55e'; msg.textContent = '正在打开邮件客户端，请发送邮件…';
        };

        // ===== 导航 =====
        window.toggleMenu = function() {
            document.getElementById('headerNav').classList.toggle('open');
        };
        document.addEventListener('click', e => {
            if (!e.target.closest('.apexon-header')) document.getElementById('headerNav').classList.remove('open');
        });

        initApp();
        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="verbalTitle">单词记忆测试 - APEXON</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        #testBox {
            flex-direction: column;
            gap: 24px;
            padding: 36px 24px;
        }
        #testBox .verbal-word {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 700;
            color: var(--apex-text);
            min-height: 1.4em;
        }
        #testBox .verbal-hint {
            font-size: 0.875rem;
            color: var(--apex-text-secondary);
            font-weight: 500;
        }
        #testBox .verbal-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #testBox .verbal-buttons .btn {
            min-width: 140px;
        }
        #testBox .verbal-feedback {
            font-size: 1rem;
            font-weight: 700;
            min-height: 1.4em;
        }
    </style>
<!-- Clarity tracking code for https://apexon.qzz.io -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xlclo5ihkp");
</script>
</head>
<body>
    <canvas id="particles"></canvas>
    <header class="apexon-header">
        <div class="apexon-header__inner">
            <a href="index.html" class="apexon-header-logo">
                <img src="assets/favicon.png" alt="Logo">
                <span>APEXON</span>
            </a>
            <button class="apexon-menu-btn" onclick="toggleMenu()" data-i18n-title="menuOpen" aria-label="打开菜单">☰</button>
            <nav class="apexon-header-nav" id="headerNav">
                <a href="index.html" class="" data-i18n="navHome">首页</a>
                <a href="reaction.html" class="" data-i18n="navReaction">反应测试</a>
                <a href="type.html" class="" data-i18n="navType">打字测试</a>
                <a href="stick.html" class="" data-i18n="navStick">注意力测试</a>
                <a href="number.html" class="" data-i18n="navNumber">数字记忆</a>
                <a href="verbal.html" class="active" data-i18n="navVerbal">单词记忆</a>
                <a href="visual.html" class="" data-i18n="navVisual">视觉记忆</a>
                <a href="aim.html" class="" data-i18n="navAim">瞄准训练</a>
                <a href="sequence.html" class="" data-i18n="navSequence">序列记忆</a>
            </nav>
            <div class="header-actions">
                <label class="apex-bw-toggle" id="bwToggle" data-i18n-title="themeToggle" title="切换深色/明亮主题">
                    <input type="checkbox" id="bwToggleInput" data-i18n-aria-label="themeToggle" aria-label="切换主题">
                    <span class="apex-bw-toggle__track">
                        <span class="apex-bw-toggle__thumb">
                            <span class="apex-bw-toggle__icon" id="bwToggleIcon">🌈</span>
                        </span>
                    </span>
                </label>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 data-i18n="verbalTitle">单词记忆测试</h1>

        <div class="info-row"><span data-i18n="progressLabel">进度</span>：<span id="progressText">0 / 30</span>　<span data-i18n="correctCountLabel">正确：</span><span id="correctDisplay">0</span></div>

        <div id="testBox" data-test-type="verbal">
            <div class="verbal-hint" data-i18n="readyStart">点击开始测试</div>
        </div>

        <div class="result" id="result"></div>

        <div class="btn-group">
            <button class="btn" onclick="restartTest()" data-i18n="testAgain">再来一次</button>
            <button class="btn" onclick="backHome()" data-i18n="backHome">返回主界面</button>
        </div>

        <div class="history-list" style="margin-top:24px">
            <div class="history-title" data-i18n="recentRecords">最近记录</div>
            <div id="historyContent" data-i18n="noRecords">还没有记录</div>
        </div>
    </div>

    <script src="js/i18n.js?v=3"></script>
    <script src="js/common.js?v=11"></script>
    <script>
    (function () {
        const t = window.APEXON && APEXON.i18n ? APEXON.i18n.t.bind(APEXON.i18n) : function(k, fb){ return fb; };
        window.toggleMenu = function () {
            document.getElementById('headerNav').classList.toggle('open');
        };
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.apexon-header')) document.getElementById('headerNav').classList.remove('open');
        });

        // 粒子背景
        APEXON.Particles.init();

        const testBox = document.getElementById('testBox');
        const result = document.getElementById('result');
        const historyContent = document.getElementById('historyContent');
        const progressText = document.getElementById('progressText');
        const correctDisplay = document.getElementById('correctDisplay');

        const WORD_POOL = [
            'apple','table','river','house','music','garden','bridge','window','flower','school',
            'market','orange','planet','rocket','coffee','summer','winter','forest','danger','silent',
            'friend','family','travel','camera','bottle','pillow','blanket','mirror','closet','guitar',
            'pencil','rabbit','turtle','monkey','giraffe','penguin','dolphin','island','desert','ocean',
            'castle','village','station','library','theater','museum','stationery','weather','morning','evening'
        ];
        const TOTAL = 30;

        let sequence = [];
        let currentIndex = 0;
        let correctCount = 0;
        let state = 'idle';

        function playSuccess() { if (APEXON.Audio) APEXON.Audio.playSuccess(); }
        function playFail() { if (APEXON.Audio) APEXON.Audio.playFail(); }

        function generateSequence() {
            const pool = WORD_POOL.slice();
            const used = new Set();
            const seen = [];
            const seq = [];
            for (let i = 0; i < TOTAL; i++) {
                const canRepeat = seen.length >= 2 && Math.random() < 0.45;
                if (canRepeat) {
                    const word = seen[Math.floor(Math.random() * seen.length)];
                    seq.push({ word: word, isRepeated: true });
                } else {
                    const available = pool.filter(w => !used.has(w));
                    const word = available[Math.floor(Math.random() * available.length)];
                    used.add(word);
                    seen.push(word);
                    seq.push({ word: word, isRepeated: false });
                }
            }
            return seq;
        }

        function renderHistory() {
            APEXON.DB.getHistoryByUserAndType(APEXON.Auth.getUserId(), 'verbal', 5).then(history => {
                const esc = APEXON.Security.escapeHtml;
                if (!history.length) {
                    historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">' + t('noRecords', '还没有记录') + '</div>';
                    return;
                }
                historyContent.innerHTML = history.map(h => '<div class="history-item"><span class="history-date">' + esc(h.date || new Date(h.timestamp).toLocaleDateString(window.APEXON && APEXON.i18n ? APEXON.i18n.getDateLocale() : 'zh-CN')) + '</span><span class="history-score">' + esc(h.score) + ' ' + t('wordUnit', '个') + '</span></div>').join('');
            }).catch(() => {
                historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">' + t('loadRecordsFailed', '加载记录失败') + '</div>';
            });
        }

        function showCard() {
            const item = sequence[currentIndex];
            const isRepeated = item.isRepeated;
            testBox.innerHTML = '<div class="verbal-hint">' + t('verbalIndexLabel', '第 {index} / {total} 个').replace('{index}', currentIndex + 1).replace('{total}', TOTAL) + '</div><div class="verbal-word">' + item.word + '</div><div class="verbal-buttons"><button class="btn" id="seenBtn">' + t('seen', '见过') + '</button><button class="btn" id="newBtn">' + t('newWord', '新词') + '</button></div><div class="verbal-feedback" id="feedback"></div>';
            const seenBtn = document.getElementById('seenBtn');
            const newBtn = document.getElementById('newBtn');

            function answer(chosenSeen) {
                seenBtn.disabled = true;
                newBtn.disabled = true;
                const isCorrect = chosenSeen === isRepeated;
                const feedback = document.getElementById('feedback');
                if (isCorrect) {
                    correctCount++;
                    correctDisplay.textContent = correctCount;
                    feedback.textContent = t('correctLabel', '正确');
                    feedback.style.color = 'var(--apex-success)';
                    playSuccess();
                } else {
                    feedback.textContent = t('wrongLabel', '错误');
                    feedback.style.color = 'var(--apex-danger)';
                    playFail();
                }
                currentIndex++;
                progressText.textContent = currentIndex + ' / ' + TOTAL;
                setTimeout(() => {
                    if (currentIndex >= TOTAL) endGame();
                    else showCard();
                }, 600);
            }
            seenBtn.addEventListener('click', () => answer(true));
            newBtn.addEventListener('click', () => answer(false));
        }

        function endGame() {
            state = 'ended';
            const grade = APEXON.Utils.getGrade(correctCount, 'verbal');
            result.innerHTML = '<div class="score-card"><div class="score-grade" style="color:' + grade.color + '">' + grade.grade + '</div><div class="score-label">' + t('correctMemory', '正确记忆 {count} / {total} 个单词').replace('{count}', correctCount).replace('{total}', TOTAL) + '</div><div class="score-details"><div class="score-detail-item"><div class="score-detail-value">' + correctCount + '</div><div class="score-detail-label">' + t('correctCountLabel', '正确：').replace('：', '') + '</div></div><div class="score-detail-item"><div class="score-detail-value">' + grade.grade + '</div><div class="score-detail-label">' + t('gradeLabel', '等级') + '</div></div></div></div>';

            APEXON.DB.saveScore(APEXON.Auth.getUserId(), APEXON.Auth.getUser(), 'verbal', { score: correctCount }).then(saved => {
                if (!saved) APEXON.UI.toast(t('saveScoreFailed', '数据保存失败，请重试'));
            });
            if (navigator.vibrate) navigator.vibrate(50);
            renderHistory();
        }

        function startTest() {
            if (state !== 'idle') return;
            state = 'running';
            sequence = generateSequence();
            currentIndex = 0;
            correctCount = 0;
            correctDisplay.textContent = '0';
            progressText.textContent = '1 / ' + TOTAL;
            result.innerHTML = '';
            showCard();
        }

        window.restartTest = function () {
            state = 'idle';
            sequence = [];
            currentIndex = 0;
            correctCount = 0;
            correctDisplay.textContent = '0';
            progressText.textContent = '0 / ' + TOTAL;
            result.innerHTML = '';
            testBox.innerHTML = '<div class="verbal-hint">' + t('readyStart', '点击开始测试') + '</div>';
            renderHistory();
        };

        testBox.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            if (state === 'idle') startTest();
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if ((e.key === ' ' || e.key === 'Enter') && state === 'idle') { e.preventDefault(); startTest(); }
            if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey) restartTest();
        });

        renderHistory();
        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>

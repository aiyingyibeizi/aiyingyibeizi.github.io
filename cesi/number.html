<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数字记忆测试 - APEXON</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        #testBox {
            flex-direction: column;
            gap: 18px;
            padding: 30px 24px;
        }
        #testBox .number-display {
            font-size: clamp(2rem, 8vw, 3.5rem);
            letter-spacing: 8px;
            font-variant-numeric: tabular-nums;
            color: var(--apex-text);
        }
        #testBox .number-input {
            width: 100%;
            max-width: 320px;
            padding: 14px 18px;
            border-radius: var(--apex-radius-sm);
            border: 2px solid var(--apex-border);
            background: var(--apex-surface);
            color: var(--apex-text);
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            text-align: center;
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
        }
        #testBox .number-input:focus {
            border-color: var(--apex-primary);
            box-shadow: 0 0 0 3px rgba(109, 93, 252, 0.15);
        }
        #testBox .number-hint {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--apex-text-secondary);
        }
    </style>
    <!-- Clerk 登录系统（已临时禁用，取消注释即可恢复）
    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_c3Rhci1zdG9yay00LmNsZXJrLmFjY291bnRzLmRleiQ"
      src="https://star-stork-4.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
      type="text/javascript">
    </script>
    -->
</head>
<body>
    <canvas id="particles"></canvas>
    <header class="apexon-header">
        <div class="apexon-header__inner">
            <a href="index.html" class="apexon-header-logo">
                <img src="assets/favicon.png" alt="Logo">
                <span>APEXON</span>
            </a>
            <button class="apexon-menu-btn" onclick="toggleMenu()" aria-label="打开菜单">☰</button>
            <nav class="apexon-header-nav" id="headerNav">
                <a href="index.html">首页</a>
                <a href="reaction.html">反应测试</a>
                <a href="type.html">打字测试</a>
                <a href="stick.html">注意力测试</a>
                <a href="number.html" class="active">数字记忆</a>
                <a href="verbal.html">单词记忆</a>
                <a href="visual.html">视觉记忆</a>
                <a href="aim.html">瞄准训练</a>
                <a href="sequence.html">序列记忆</a>
            </nav>
            <div class="header-actions">
                <label class="apex-bw-toggle" id="bwToggle" title="切换深色/明亮主题">
                    <input type="checkbox" id="bwToggleInput" aria-label="切换黑白模式">
                    <span class="apex-bw-toggle__track">
                        <span class="apex-bw-toggle__thumb">
                            <span class="apex-bw-toggle__icon" id="bwToggleIcon">🌈</span>
                        </span>
                    </span>
                </label>
                <!-- Clerk 官方 UserButton 挂载点（已临时禁用，取消注释即可恢复）
                <div class="header-user-wrap" id="headerUserWrap">
                    <div id="user-menu-container"></div>
                    <span class="header-user-login" id="headerUserLogin">
                        <svg class="header-user-avatar header-user-avatar--guest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
                        </svg>
                        <span>登录</span>
                    </span>
                    <span class="header-user-name" id="headerUserName"></span>
                </div>
                -->
            </div>
        </div>
    </header>

    <div class="container">
        <h1>数字记忆测试</h1>

        <div class="info-row" id="statusLine">当前位数：<span id="levelDisplay">3</span></div>

        <div id="testBox" data-test-type="number">准备开始</div>

        <div class="result" id="result"></div>

        <div class="btn-group">
            <button class="btn" onclick="restartTest()">再来一次</button>
            <button class="btn" onclick="backHome()">返回主界面</button>
        </div>

        <div class="history-list" style="margin-top:24px">
            <div class="history-title">最近记录</div>
            <div id="historyContent">还没有记录</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
    (function () {
        window.toggleMenu = function () {
            document.getElementById('headerNav').classList.toggle('open');
        };
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.apexon-header')) document.getElementById('headerNav').classList.remove('open');
        });

        /* 登录系统已临时禁用，取消注释即可恢复
        APEXON.UI.mountUserButton('user-menu-container');
        */

        // 粒子背景
        APEXON.Particles.init();

        const testBox = document.getElementById('testBox');
        const result = document.getElementById('result');
        const historyContent = document.getElementById('historyContent');
        const levelDisplay = document.getElementById('levelDisplay');
        const statusLine = document.getElementById('statusLine');

        let level = 3;
        let currentNumber = '';
        let state = 'idle';
        let showTimer = null;

        function generateNumber(len) {
            let s = '';
            for (let i = 0; i < len; i++) s += Math.floor(Math.random() * 10);
            return s;
        }

        function playSuccess() { try { if (APEXON.Audio) APEXON.Audio.playSuccess(); } catch (e) {} }
        function playFail() { try { if (APEXON.Audio) APEXON.Audio.playFail(); } catch (e) {} }

        function renderHistory() {
            if (!APEXON.Auth.isLoggedIn()) {
                historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">登录后同步云端记录</div>';
                return;
            }
            APEXON.DB.getHistoryByUserAndType(APEXON.Auth.getUserId(), 'number', 5).then(history => {
                const esc = APEXON.Security.escapeHtml;
                if (!history.length) {
                    historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">还没有记录</div>';
                    return;
                }
                historyContent.innerHTML = history.map(h => '<div class="history-item"><span class="history-date">' + esc(h.date || new Date(h.timestamp).toLocaleDateString('zh-CN')) + '</span><span class="history-score">' + esc(h.score) + ' 位</span></div>').join('');
            }).catch(() => {
                historyContent.innerHTML = '<div style="color:var(--apex-text-tertiary);font-size:13px">加载记录失败</div>';
            });
        }

        function startRound() {
            state = 'showing';
            currentNumber = generateNumber(level);
            levelDisplay.textContent = level;
            testBox.innerHTML = '<div class="number-hint">请记住这些数字</div><div class="number-display">' + currentNumber + '</div>';
            result.innerHTML = '';
            showTimer = setTimeout(() => {
                state = 'input';
                testBox.innerHTML = '<div class="number-hint">请输入刚才的数字</div><input type="tel" inputmode="numeric" class="number-input" id="numberInput" maxlength="' + level + '" autocomplete="off"><button class="btn" id="submitBtn" style="margin-top:6px">确认</button>';
                const input = document.getElementById('numberInput');
                const submitBtn = document.getElementById('submitBtn');
                input.focus();
                function check() {
                    const val = input.value.trim();
                    if (val.length < level) return;
                    if (val === currentNumber) {
                        playSuccess();
                        level++;
                        levelDisplay.textContent = level;
                        testBox.innerHTML = '<div class="number-hint">回答正确！</div>';
                        setTimeout(startRound, 800);
                    } else {
                        playFail();
                        endGame(level);
                    }
                }
                submitBtn.addEventListener('click', check);
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
                input.addEventListener('input', () => {
                    input.value = input.value.replace(/\D/g, '');
                    if (input.value.length >= level) check();
                });
            }, 1000);
        }

        function endGame(score) {
            state = 'ended';
            clearTimeout(showTimer);
            const grade = APEXON.Utils.getGrade(score, 'number');
            result.innerHTML = '<div class="score-card"><div class="score-grade" style="color:' + grade.color + '">' + grade.grade + '</div><div class="score-label">最高记忆 ' + score + ' 位数字</div><div class="score-details"><div class="score-detail-item"><div class="score-detail-value">' + score + '</div><div class="score-detail-label">位数</div></div><div class="score-detail-item"><div class="score-detail-value">' + grade.grade + '</div><div class="score-detail-label">等级</div></div></div></div>';

            if (APEXON.Auth.isLoggedIn()) {
                APEXON.DB.saveScore(APEXON.Auth.getUserId(), APEXON.Auth.getUser(), 'number', { score: score }).then(saved => {
                    if (!saved) APEXON.UI.toast('数据保存失败，请重试');
                });
            }
            try { if (navigator.vibrate) navigator.vibrate(50); } catch (e) {}
            renderHistory();
        }

        function startTest() {
            if (state !== 'idle') return;
            level = 3;
            levelDisplay.textContent = level;
            result.innerHTML = '';
            startRound();
        }

        window.restartTest = function () {
            clearTimeout(showTimer);
            state = 'idle';
            level = 3;
            levelDisplay.textContent = level;
            result.innerHTML = '';
            testBox.innerHTML = '准备开始';
            renderHistory();
        };

        testBox.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            if (state === 'idle') startTest();
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if ((e.key === ' ' || e.key === 'Enter') && state === 'idle') { e.preventDefault(); startTest(); }
            if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey) restartTest();
        });

        renderHistory();
        document.body.classList.add('loaded');
    })();
    </script>
</body>
</html>
